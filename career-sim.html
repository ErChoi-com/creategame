<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Sim — The Independent Auteur</title>
<style>
  :root {
    --bg: #12100e;
    --panel: #1c1815;
    --panel2: #241f1a;
    --accent: #d4a54a;
    --accent2: #8f5c2c;
    --text: #ece5da;
    --dim: #9c9184;
    --good: #6fae5c;
    --bad: #b5563f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: radial-gradient(ellipse at top, #211c17 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }
  h1 { font-size: 1.6em; margin: 0 0 2px 0; letter-spacing: 0.5px; }
  .subtitle { color: var(--accent); font-style: italic; margin-bottom: 20px; }
  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid #332c24;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 1em;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin: 0 0 12px 0;
    border-bottom: 1px solid #332c24;
    padding-bottom: 6px;
  }
  .stat-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.9em; }
  .stat-label { width: 110px; color: var(--dim); }
  .bar-track { flex: 1; height: 8px; background: #2b241d; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
  .stat-val { width: 30px; text-align: right; margin-left: 8px; color: var(--text); }
  .headline {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    margin-bottom: 10px; font-size: 0.95em;
  }
  .headline div { background: var(--panel2); padding: 8px 12px; border-radius: 8px; min-width: 100px; }
  .headline .label { color: var(--dim); font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.5px; }
  .headline .value { font-size: 1.15em; margin-top: 2px; }
  .trait-note {
    font-size: 0.85em; color: var(--dim); line-height: 1.5; margin-top: 8px;
    border-left: 3px solid var(--accent2); padding-left: 10px;
  }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 500px) { .actions { grid-template-columns: 1fr; } }
  button.action {
    background: var(--panel2);
    border: 1px solid #3a3226;
    color: var(--text);
    padding: 12px;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9em;
    transition: border-color 0.15s, transform 0.1s;
  }
  button.action:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  button.action .title { font-weight: bold; color: var(--accent); display: block; margin-bottom: 4px; }
  button.action .desc { color: var(--dim); font-size: 0.85em; }
  .recommended { box-shadow: 0 0 0 1px var(--accent) inset; }
  .recommended .title::after { content: " ★ auteur pick"; color: var(--accent); font-size: 0.75em; font-weight: normal; }
  #log {
    max-height: 260px;
    overflow-y: auto;
    display: flex;
    flex-direction: column-reverse;
    font-size: 0.9em;
  }
  .entry { padding: 6px 0; border-bottom: 1px dashed #2b241d; }
  .entry .year-tag { color: var(--accent); margin-right: 6px; }
  .entry.good { color: var(--good); }
  .entry.bad { color: var(--bad); }
  #filmography { font-size: 0.85em; }
  #filmography .film { padding: 4px 0; border-bottom: 1px dashed #2b241d; color: var(--dim); }
  #filmography .film b { color: var(--text); }
  #restart-wrap { text-align: center; margin-top: 14px; }
  #restart-wrap button {
    background: var(--accent2); color: var(--text); border: none; padding: 10px 22px;
    border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.95em;
  }
  #ending-title { font-size: 1.4em; color: var(--accent); margin-bottom: 6px; }
</style>
</head>
<body>
  <h1 id="char-name">Jonah Ricci</h1>
  <div class="subtitle" id="archetype">The Independent Auteur — self-financed, self-made</div>

  <div class="layout">
    <div>
      <div class="panel">
        <h2>Vitals</h2>
        <div class="headline" id="headline"></div>
      </div>
      <div class="panel">
        <h2>Stats</h2>
        <div id="stats"></div>
        <div class="trait-note" id="trait-note"></div>
      </div>
      <div class="panel">
        <h2>Filmography</h2>
        <div id="filmography"><div class="film" style="color:var(--dim)">No credits yet.</div></div>
      </div>
    </div>

    <div>
      <div class="panel" id="game-over-panel" style="display:none;">
        <div id="ending-title"></div>
        <div id="ending-body" style="line-height:1.6;"></div>
        <div id="restart-wrap"><button id="restart-btn">Start a new career</button></div>
      </div>

      <div class="panel" id="actions-panel">
        <h2>This Year</h2>
        <div class="actions" id="actions"></div>
      </div>

      <div class="panel">
        <h2>Career Log</h2>
        <div id="log"></div>
      </div>
    </div>
  </div>

  <script src="career-sim.js"></script>
</body>
</html>
