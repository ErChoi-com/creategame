    // materially better material when you come back. Whether that is a good
    // trade depends entirely on what the Heat was buying you.
    const menteePull = this.mentees.filter((m) => m.power > 55).length;

    const listings = [];
    for (let i = 0; i < count + (this.scarcity > 20 ? 1 : 0) + menteePull; i++) {
      const role = this.world.generateRole(a);
      if (this.scarcity > 0) {
        // Two years away buys materially better material when you come back.
        role.scriptQuality = clamp(role.scriptQuality + 0.4 * this.scarcity, 5, 98);
        role.difficulty -= Math.min(12, 0.3 * this.scarcity);
        role.scarcityPremium = this.scarcity;
      }
      // §6.8's worked route in: a studio casts an unknown as the lead of a
    // property, because the property is the star and an unknown is cheap and
    // will sign for five pictures. It is a lottery ticket, it pays badly, and
    // it is how almost every franchise actor actually started.
    if (i === 0 && !this.franchise && a.age < 34 && this.credits.length < 14
        && this.rng.chance(0.012 + a.gates.look / 6000 + a.attrs.presence / 9000)) {
      role.billing = 'lead';
      role.type = 'tentpole';
      role.budget = Math.max(role.budget, 90);
      role.budgetForRole = role.budget * 0.02;   // they are paying you nothing
      role.blocks = 3;
      role.label = 'Tentpole';
      role.difficulty = 40;
      role.unknownLead = true;
      role.scriptQuality = clamp(role.scriptQuality - 6, 5, 98);
    }

    // The property comes back around, and it comes back to you.
    // Offered when they are ready to shoot the next one — and the clock only
    // resets when you actually make it, or a year you could not clear the
    // dates for would quietly end the relationship.
    if (this.franchise && !this.franchise.writtenOut
        && a.age < 62
        && this.franchise.installments < this.franchise.maxInstallments
        && this.franchise.identification > 20
        && i === 0 && this.year - (this.franchise.lastInstallment || -3) >= 2) {
      role.billing = 'lead';
      role.type = 'tentpole';
      role.genre = this.franchise.genre;
      role.title = `${this.franchise.title} ${roman(this.franchise.installments + 1)}`;
      role.budget = Math.max(role.budget, 120);
      role.budgetForRole = role.budget * 0.14;
      role.blocks = 3;
      role.label = 'Tentpole';
      role.path = 'direct';
      role.difficulty = 0;
      role.franchiseInstallment = true;
    }

    // Someone you taught fifteen years ago is casting something now.
      if (i >= count && menteePull) {
        const m = this.mentees.find((x) => x.power > 55);
        if (m) { role.viaMentee = m.person.name; role.difficulty -= 14; }
      }
      // The union catch-22, made passable: non-union work exists, pays badly,
      // and is how the first three credits happen (§10.1, review §4).
      if (role.union && a.unionCredits < 3 && !this.rng.chance(0.25)) {
        role.union = false;
        role.budget *= 0.35;
        role.budgetForRole *= 0.35;
        role.difficulty -= 8;
        role.nonUnionNote = true;
      }
      const rel = this._relationshipBonus(role);
      const u = M.utility(a, role, rel) + (this.positions.has('board') ? 4 : 0);
      const p = M.offerProbability(u, role.difficulty);
      // Things that come to you rather than being auditioned for: the next
      // installment of your own franchise, and anything you made happen.
      const handed = role.franchiseInstallment || role.yours || role.comeback;
      listings.push({
        ...role,
        utility: handed ? 100 : u,
        chance: handed ? 1 : p,
        path: handed ? 'direct' : M.castingPath(u, role, rel),
        relationshipBonus: rel,
        fit: M.fitScore(a, role),
      });
    }
    // §0.3 rule 3 — an established actor's agent brings them three things, not
    // nine. What reaches you narrows as you rise, which is what stops a
    // sixty-year career becoming sixty years of spreadsheet.
    const reach = clamp(Math.round(6 - M.standing(a.standing) / 22), 2, 7);

    // Your standing orders decide what your agent bothers you with at all.
    const floor = this.standingOrders.floor;
    const passes = (r) => floor === 'anything'
      || (floor === 'supporting' && r.billing !== 'bit')
      || (floor === 'lead' && r.billing === 'lead');
    const shown = listings.filter(passes);

    this.yearListings += shown.length;

    // The board is sorted the way an agent would present it.
    shown.sort((x, y) => (y.chance * BILLING_WEIGHT[y.billing]) - (x.chance * BILLING_WEIGHT[x.billing]));
    const kept = shown.slice(0, reach);
    this.board = kept;
    return kept;
  }

  // §4.9 role volume by age. The late bands are steep because they are steep:
  // most careers do not end in a decision, they end in a year with no offers
  // in it, and then another one.
  _ageBand(age) {
    return age < 28 ? 1.30 : age < 39 ? 1.45 : age < 49 ? 0.92 : age < 61 ? 0.40 : 0.12;
  }

  _relationshipBonus(role) {
    let bonus = 0;
    const d = role.director;
    if (d) bonus += 0.30 * Math.max(0, d.affinity) - 0.55 * d.grudge;
    const c = role.castingDirector;
    if (c) bonus += 0.18 * Math.max(0, c.affinity);
    return clamp(bonus, -30, 40);
  }

  // Attempt a role. Returns { cast, path, role, note }.
  pursue(roleId) {
    const role = this.board.find((r) => r.id === roleId);
    if (!role) return { cast: false, note: 'That listing is gone.' };
    // One shot per listing. You cannot re-audition for the part you lost.
    this.board = this.board.filter((r) => r.id !== roleId);
    if (this.blocksBooked + role.blocks > 4) {
      return { cast: false, note: 'The dates do not work. You are shooting.' };
    }
    if (role.union && this.actor.unionCredits < 3) {
      return { cast: false, note: 'Union production. You need three union credits and you have ' + this.actor.unionCredits + '.' };
    }

    if (role.path === 'direct') {
      this.currentRole = role;
      this.say(`${role.director.name} offered you ${role.title} outright.`, 'good');
      return { cast: true, path: 'direct', role };
    }
    if (role.path === 'offer') {
      this.currentRole = role;
      this.say(`An offer, no audition: ${role.title}.`, 'good');
      return { cast: true, path: 'offer', role };
    }
    // You are not the only person who can do this. Every audition is against a
    // field, and the field gets better as the part gets better.
    const field = role.billing === 'lead' ? M.K.fieldLead
      : role.billing === 'supporting' ? M.K.fieldSupporting : M.K.fieldBit;
    const won = this.rng.chance(role.chance * field);
    role.castingDirector.memory[this.actor.name] = (role.castingDirector.memory[this.actor.name] || 0) + 1;
    if (won) {
      role.castingDirector.affinity = clamp(role.castingDirector.affinity + 4, -100, 100);
      this.rolodex.edge(role.castingDirector).affinity += 4;
      this.currentRole = role;
      this.say(`You read for ${role.title} and got it.`, 'good');
      return { cast: true, path: 'audition', role };
    }
    role.castingDirector.affinity = clamp(role.castingDirector.affinity + 1, -100, 100);
    if (role.publicCampaign) {
      this.actor.standing.notoriety = clamp(this.actor.standing.notoriety + 6, 0, 100);
      this.say(`You said publicly that you wanted ${role.title}. You did not get ${role.title}.`, 'bad');
    } else {
      this.say(this._rejection(role), 'bad');
    }
    return { cast: false, path: 'audition', role };
  }

  // §0.6 — the obituary remembers what you said no to.
  decline(roleId) {
    const role = this.board.find((r) => r.id === roleId);
    if (!role) return null;
    this.board = this.board.filter((r) => r.id !== roleId);
    this.turnedDown.push({
      title: role.title, year: this.year, billing: role.billing,
      genre: role.genre, budget: role.budget, director: role.director.name,
      id: role.id,
    });
    return role;
  }

  // Rejection is most of this job and it should not read like one line of copy
  // repeated four hundred times.
  _rejection(role) {
    const t = role.title;
    const lines = [
      `You read for ${t}. They went another way.`,
      `You read for ${t} twice. The second one was the callback, which is worse.`,
      `${t} went to someone with a name.`,
      `You were on the list for ${t} until you were not.`,
      `${role.castingDirector.name} liked you for ${t}. The director did not.`,
      `They said thank you for coming in on ${t}.`,
      `${t}: no callback, no explanation, which is the explanation.`,
      `You put yourself on tape for ${t} and heard nothing at all.`,
    ];
    return lines[this.rng.int(0, lines.length - 1)];
  }

  // The turns a career actually has. Said once, when they happen.
  _milestone(role) {
    const a = this.actor;
    const counts = this.credits.filter((c) => c.billing === role.billing).length;
    if (role.billing === 'supporting' && counts === 1) {
      return 'Your first proper part. Somebody in a room decided you could carry scenes.';
    }
    if (role.billing === 'lead' && counts === 1) {
      return 'Your name is above the title of a film for the first time.';
    }
    if (a.unionCredits === 3) return 'Three union credits. The real board opens now.';
    if (this.credits.length === 10) return 'Ten credits. You are a working actor, whatever else you are.';
    if (this.credits.length === 50) return 'Fifty credits. Most people who started when you did are doing something else.';
    return null;
  }

  // ------------------------------------------------------------------- shoot
  // Books the calendar, resolves prep, the three moments and the performance,
  // then queues the film for release. Positions are the player's creative call.
  shoot(role, choices = {}) {
    const a = this.actor;
    const prepChoice = PREP_OPTIONS[choices.prep] || PREP_OPTIONS.table;
    const positions = choices.positions || { energy: 'with', volume: 'with', warmth: 'with', speed: 'with' };
    const momentChoices = choices.moments || {};

    this.blocksBooked += role.blocks;
    this.markWorked(role.billing);
    this.currentRole = null;

    let prep = clamp(prepChoice.base * (0.8 + 0.004 * a.attrs.resilience) - (role.prepPenalty || 0), 0, 100);
    if (prepChoice.periodBonus && (role.genre === 'period' || role.archetype === 'authority')) {
      prep += prepChoice.periodBonus;
    }
    if (prepChoice.craft) a.attrs.craft = clamp(a.attrs.craft + prepChoice.craft, 5, 99);
    if (prepChoice.resilience) a.attrs.resilience = clamp(a.attrs.resilience + prepChoice.resilience, 5, 99);
    if (prepChoice.health) a.health = clamp(a.health + prepChoice.health, 0, 100);
    if (prepChoice.flag) a.flags[prepChoice.flag] = this.year;

    const director = role.director;
    const dSkill = this.world.directorSkill(director);
    const command = clamp(director.command + 0.25 * Math.max(0, director.affinity), 0, 100);

    let chemistry = clamp(this.rng.gauss(58, 16) + 0.2 * Math.max(0, role.costar.affinity)
      - 0.3 * role.costar.ego / 10 + (role.chemistryBonus || 0), 0, 100);
    let condition = clamp(a.condition - 0.25 * role.chaos + 0.3 * a.attrs.resilience - 12 * (this.blocksBooked / 4), 20, 100);
    let perfNudge = 0, ensembleNudge = 0;

    // Which moments you were consulted on, and which ones simply happened.
    // The ordinary days of a shoot always happen — being experienced means
    // nobody asks you about them, not that they stop occurring.
    const asked = choices.momentSet || this.momentsFor(role);
    const prompted = new Set(asked.map((m) => m.id));
    const happening = [];
    const seen = new Set();
    for (const m of [...MOMENT_POOL.filter((x) => x.core), ...asked]) {
      if (seen.has(m.id)) continue;
      seen.add(m.id);
      happening.push(m);
    }
    const momentLog = [];
    for (const moment of happening) {
      const pickId = momentChoices[moment.id] || this.defaultMomentChoice(moment.id, moment);
      const opt = moment.options.find((o) => o.id === pickId) || moment.options[1];
      const e = opt.effect;
      chemistry = clamp(chemistry + (e.chemistry || 0), 0, 100);
      prep = clamp(prep + (e.prep || 0), 0, 100);
      condition = clamp(condition + (e.condition || 0), 0, 100);
      perfNudge += e.perf || 0;
      ensembleNudge += e.ensemble || 0;
      if (e.affinity) director.affinity = clamp(director.affinity + e.affinity, -100, 100);
      if (e.favour) this.rolodex.gain(role.costar, 'generosity', this.year);
      if (e.costarAffinity) {
        const edge = this.rolodex.edge(role.costar);
        edge.affinity = clamp(edge.affinity + e.costarAffinity, -100, 100);
      }
      if (e.costarGrudge) {
        const edge = this.rolodex.edge(role.costar);
        edge.grudge = clamp(edge.grudge + e.costarGrudge, 0, 100);
      }
      if (e.notoriety) a.standing.notoriety = clamp(a.standing.notoriety + e.notoriety, 0, 100);
      if (e.crew) this.crewLoyalty = (this.crewLoyalty || 0) + e.crew;
      if (e.injuryRisk && this.rng.chance(e.injuryRisk)) {
        a.health = clamp(a.health - this.rng.int(6, 20), 0, 100);
        a.gates.physicality = clamp(a.gates.physicality - this.rng.int(0, 6), 5, 98);
        this.say('The fall went wrong. Six weeks, and it never quite goes away.', 'bad');
      }
      momentLog.push({ moment: moment.id, chose: opt.label, asked: prompted.has(moment.id) });
    }

    const palette = role.palette || this.world.randomPalette(this.rng, role.genre, role.budget, director.taste);
    const coh = M.coherence(palette);
    const film = { palette, coherence: coh.value, nearest: coh.nearest };

    const fit = clamp(M.fitScore(a, role) + (role.fitBonus || 0), 0, 100);
    const perf = M.performance(this.rng, {
      actor: a, role, film, prep, chemistry, condition,
      directorSkill: dSkill, fit,
    });
    perf.value = clamp(perf.value + perfNudge, 0, 100);

    // §6.6 improvising against the script: high variance, rewards Instinct,
    // and the director's patience is a real thing you are spending.
    if (role.improvised) {
      const swing = this.rng.gauss(0.35 * (a.attrs.instinct - 52) / 10, 11);
      perf.value = clamp(perf.value + swing, 0, 100);
      role.director.affinity = clamp(role.director.affinity + (swing > 0 ? 3 : -8), -100, 100);
    }

    const resolved = M.resolvePositions(positions, {
      genre: role.genre,
      craft: a.attrs.craft,
      directorCommand: command,
      partnerPositions: this._costarPositions(role),
    });
    resolved.forFilm += ensembleNudge;

    const shaped = M.shapePerformance(perf.value, resolved, a.attrs.presence);

    // §5.4 a landmark rewrites what films are, permanently.
    const skill = (a.attrs.craft + director.vision) / 2;
    const landmark = this.rng.chance(M.landmarkChance(coh.value, skill));
    if (landmark) this.world.addShape(`${role.title.toLowerCase().replace(/\s+/g, '_')}`, palette);

    // Condition and health carry out of the shoot.
    a.condition = clamp(condition + 6, 10, 100);
    if (role.genre === 'action' && this.rng.chance(0.06 + 0.002 * (60 - a.gates.physicality))) {
      a.health = clamp(a.health - this.rng.int(4, 16), 0, 100);
      this.say('An injury on the second unit. It will be fine. It is mostly fine.', 'bad');
    }

    const project = {
      role, film, palette, prep, chemistry, condition, positions, resolved, shaped,
      perf, landmark, directorSkill: dSkill, director,
      releaseIn: this.rng.int(2, 5),
      prepFlag: prepChoice.flag || null,
      momentLog,
    };
    this.pending.push(project);
    a.unionCredits += role.union ? 1 : 0;
    // Held by reference so release() can write the box office back onto it a
    // year later: the filmography is the only place a career's grosses live.
    const credit = {
      title: role.title, year: this.year, billing: role.billing,
      genre: role.genre, tentpole: role.type === 'tentpole',
      unknownLead: !!role.unknownLead, installment: !!role.franchiseInstallment,
      budget: role.budget, gross: null,
    };
    this.credits.push(credit);
    project.credit = credit;
    a.genreCredits[role.genre] = (a.genreCredits[role.genre] || 0) + 1;
    if (prepChoice.clearsGate) {
      a.solvedGates[prepChoice.clearsGate] = (a.solvedGates[prepChoice.clearsGate] || 0) + 1;
    }

    // The deal, paid on signature — unless you waived it to be in this at all.
    let income = M.fee(this.rng, a, role, this.agentTier, a.recentRoi, this.world.eraMultiplier);
    if (this.franchise && role.type === 'tentpole' && !this.franchise.writtenOut) {
      // They cannot recast you, and the quote reflects it. This is what
      // indispensability is for: it is the one leverage money cannot buy.
      income *= 1 + this.franchise.identification / 35;
    }
    if (role.scarcityPremium) income *= 1 + 0.010 * role.scarcityPremium;
    if (role.takeScale) {
      income = Math.min(income, 0.02);
      this.rolodex.gain(director, 'scale', this.year);
      a.attrs.craft = clamp(a.attrs.craft + 1.5, 5, 99);
    }
    M.applyLifestyle(this.money, income);
    project.fee = income;

    // Everyone you just spent three months with is now someone you know.
    this.rolodex.contact(director, this.year);
    this.rolodex.contact(role.costar, this.year);
    if (project.resolved.generosity > 0) this.rolodex.gain(role.costar, 'generosity', this.year);
    if (project.resolved.upstaging > 0) {
      const e = this.rolodex.edge(role.costar);
      e.grudge = clamp(e.grudge + 18, 0, 100);
    }
    // Proximity is how you come to know things about people (§6.1).
    if (this.rng.chance(0.12 + director.temperament === 'chaotic' ? 0.1 : 0)) {
      this.information.push({ about: director, kind: 'something from the set' });
    }

    // §6.4 franchises. Identification with a property is built by doing it
    // again, and it is the only leverage that cannot be bought.
    if (role.type === 'tentpole' && role.billing !== 'bit') {
      if (this.franchise && this.franchise.genre === role.genre && !this.franchise.writtenOut) {
        this.franchise.installments += 1;
        this.franchise.lastInstallment = this.year;
        // §6.4's own worked example: identification 67 by the fourth
        // installment. Doing them back to back has to compound, or the
        // creative custodian of a property is indistinguishable from someone
        // who took a big job twice.
        this.franchise.identification = clamp(this.franchise.identification + 18, 0, 100);
        // §6.3 approvals arrive with indispensability, not with money.
        if (this.franchise.identification > 55) this.approvals.add('costar');
        if (this.franchise.identification > 75) this.approvals.add('script');
      } else if (!this.franchise || this.franchise.writtenOut) {
        this.franchise = {
          title: role.title, genre: role.genre, installments: 1,
          identification: role.unknownLead ? 46 : 34,
          lastInstallment: this.year,
          // Properties run out. Nobody makes eleven of them with the same
          // person, and the studio reboots it without you afterwards.
          maxInstallments: this.rng.int(3, 6),
          heldOut: false, writtenOut: false, owned: false,
        };
      }
      this.stats.peakIdentification = Math.max(
        this.stats.peakIdentification, this.franchise.identification,
      );
    }

    this.say(
      `${role.title} — ${role.billing}, ${role.label}, ${director.name} directing. ` +
      `${this._qualitativeRead(perf.value, director)}`,
      'work',
    );
    project.readConfidence = this.readConfidence(director);
    const milestone = this._milestone(role);
    if (milestone) this.say(milestone, 'good');
    return project;
  }

  _costarPositions(role) {
    // Ego decides how much space your scene partner takes.
    const p = {};
    for (const d of PERF_DIALS) {
      p[d] = role.costar.ego > 70
        ? this.rng.pick(['beyond', 'against', 'with'])
        : this.rng.pick(['with', 'with', 'beneath']);
    }
    return p;
  }

  // §4.7 you never see the number. You see what the director's face did — and
  // how well you can read that face is itself a thing you get better at.
  //
  // The sports-management sims that model hidden ability well (Football
  // Manager's judging attributes, Total Extreme Wrestling's scouting levels
  // that rise only while you are actually doing the thing) all separate the
  // truth from your estimate of it, and let the estimate improve with specific
  // experience. Here: craft sharpens your sense of your own work in general,
  // and having worked with this director before sharpens it for this room.
  readError(director) {
    const base = director.temperament === 'remote' ? 16 : 9;
    const craft = 0.055 * this.actor.attrs.craft;             // knowing your own work
    const familiar = Math.min(3.5, 1.6 * (director.sharedProjects || 0));  // knowing them
    const worn = this.actor.condition < 45 ? 2 : 0;
    return clamp(base - craft - familiar + worn, 2.5, 18);
  }

  _qualitativeRead(value, director) {
    const noisy = value + this.rng.gauss(0, this.readError(director));
    if (noisy > 80) return 'The room went quiet after the last take.';
    if (noisy > 66) return 'They printed it and moved on, which is the compliment.';
    if (noisy > 50) return 'You got there by take nine.';
    if (noisy > 36) return 'They shot a lot of coverage on you.';
    return 'They started asking the other actor for reactions.';
  }

  // How much that read is worth, said plainly, so the player knows whether to
  // believe it. This is the one number about your own performance you get.
  readConfidence(director) {
    const e = this.readError(director);
    if (e < 5) return 'You know exactly how that went.';
    if (e < 8) return 'You have a fair idea how that went.';
    if (e < 12) return 'You genuinely cannot tell how that went.';
    return 'You have no idea how that went. You never do with them.';
  }

  // ----------------------------------------------------------------- release
  releaseDue() {
    return this.pending.filter((p) => p.releaseIn <= 0);
  }

  tickPending() {
    const out = [];
    for (const p of this.pending) {
      p.releaseIn -= 1;
      if (p.releaseIn <= 0) out.push(p);
    }
    this.pending = this.pending.filter((p) => p.releaseIn > 0);
    return out.map((p) => this.release(p));
  }

  release(project) {
    const a = this.actor;
    const role = project.role;

    // §4.2 staleness — critics punish repetition, audiences do not.
    const lane = `${role.genre}:${role.archetype}`;
    a.consecutiveSameLane = lane === a.lastLane ? a.consecutiveSameLane + 1 : 0;
    a.lastLane = lane;
    const staleness = Math.min(12, Math.max(0, 2 * (a.consecutiveSameLane - 2)));

    // The ensemble is the billing-weighted mean of everyone's contribution,
    // and yours is the Part 5 number — one Ensemble, one Notices (FIX-2).
    const bw = BILLING_WEIGHT[role.billing];
    // Who else is in it. §4.10's "0.80 of the ensemble is yours" is only true
    // of a two-hander; a lead still carries most of it, and a bit player is one
    // voice in a room, which is exactly the asymmetry the review asked for.
    const others = role.billing === 'lead'
      ? [{ v: clamp(this.rng.gauss(58, 14), 0, 100), w: 0.55 },
         { v: clamp(this.rng.gauss(56, 14), 0, 100), w: 0.25 }]
      : role.billing === 'supporting'
        ? [{ v: clamp(this.rng.gauss(59, 14), 0, 100), w: 1.0 },
           { v: clamp(this.rng.gauss(56, 14), 0, 100), w: 0.55 },
           { v: clamp(this.rng.gauss(54, 14), 0, 100), w: 0.2 }]
        : [{ v: clamp(this.rng.gauss(59, 14), 0, 100), w: 1.0 },
           { v: clamp(this.rng.gauss(57, 14), 0, 100), w: 0.55 },
           { v: clamp(this.rng.gauss(55, 14), 0, 100), w: 0.55 }];
    let num = project.shaped.ensembleValue * bw, den = bw;
    for (const o of others) { num += o.v * o.w; den += o.w; }
    const ensembleScore = num / den;

    // Quality and reach read the film's real budget; money reads the nominal
    // one. Otherwise a 2010 mid-budget drama looks like a 1974 epic.
    //
    // Derived, never stored: three paths rewrite role.budget after the role is
    // generated (the non-union downgrade, the unknown-lead ticket, a franchise
    // installment), and a snapshot taken at generation would have the model
    // simulating a different film from the one on the board.
    const realBudget = M.realBudget(role);

    // Everyone else in the cast is somebody too, and a studio pays for that.
    const castStarPower = clamp(
      0.42 * M.starPower(a.standing) * bw + 0.34 * role.costar.heat
        + 0.24 * clamp(14 + 26 * Math.log10(Math.max(1, realBudget)), 0, 100),
      0, 100,
    );

    const rec = M.reception(this.rng, {
      film: project.film,
      genre: role.genre,
      budget: realBudget,
      scriptQuality: role.scriptQuality,
      directorSkill: project.directorSkill,
      directorPrestige: project.director.prestige,
      castStarPower,
      genreDemand: this.world.demand[role.genre],
      ensembleScore,
      yourNotices: project.shaped.notices,
      billing: role.billing,
      stalenessPenalty: staleness,
      palette: project.palette,
    });

    // A critic you have had lunch with for nine years is still a critic, but
    // the noise term leans (§6.6).
    if (this.criticSkew) rec.filmCritic = clamp(rec.filmCritic + this.criticSkew, 0, 100);

    // §5.4 the loop closing on you: the shape you invented is now a shape
    // everyone uses, and using it yourself reads as tired.
    const cliche = this.world.clicheePenalty(project.palette);
    if (cliche > 0) {
      rec.filmCritic = clamp(rec.filmCritic - cliche, 0, 100);
      rec.clicheHit = cliche;
    }

    // §10.3 a festival premiere trades the opening weekend for the room.
    if (project.festival) {
      rec.filmCritic = clamp(rec.filmCritic + 5, 0, 100);
      rec.notices = clamp(rec.notices + 4, 0, 100);
      rec.roi *= 0.72;
      rec.gross *= 0.72;
    }

    if (project.landmark) {
      rec.filmCritic = clamp(rec.filmCritic + 14, 0, 100);
      rec.notices = clamp(rec.notices + 6, 0, 100);
      const mark = this.world.addShape(project.role.title, project.palette, project.role.genre, this.actor.name);
      rec.landmarkName = mark.name;
      this.say(`Nobody has seen a film shaped like ${project.role.title} before. They will now.`, 'good');
    }

    const deltas = M.applyReception(a.standing, rec, role.billing, this.credits.length, realBudget);
    this.noticesHistory.push(rec.notices);
    M.updateRecognition(a, rec.notices, role.billing);
    M.updatePersona(a.persona, role.genre, role.archetype, role.billing, rec.audience);
    a.recentRoi = 0.6 * a.recentRoi + 0.4 * rec.roi;
    this.stats.peakHeat = Math.max(this.stats.peakHeat, a.standing.heat);
    if (role.billing === 'lead') {
      this.stats.leadCredits += 1;
      if (a.age >= 42) this.stats.leadsAfter42 += 1;
    }

    // §4.5 backend. Net points are an accounting joke; gross points are the
    // real prize, and only a high-Bankability lead is ever offered them. This
    // is where the top of the market separates from the middle.
    const bank = M.bankability(a.standing, a.recentRoi);
    const heldPoints = (this.franchise && role.type === 'tentpole' && this.franchise.grossPoints) || 0;
    if (heldPoints && rec.gross > 0) {
      // The holdout, paid out. This is what indispensability is actually for.
      const paid = heldPoints * rec.gross * (role.era ?? 1);
      M.applyLifestyle(this.money, paid);
      this.say(`Your holdout points on ${role.title} paid $${paid.toFixed(1)}M.`, 'good');
    }
    if (role.producerShare && rec.gross > 0) {
      const producerTake = role.producerShare * rec.gross * (role.era ?? 1) * 0.5;
      M.applyLifestyle(this.money, producerTake);
      if (producerTake > 1) {
        this.say(`Your producer share on ${role.title} came to $${producerTake.toFixed(1)}M.`, 'good');
      }
    }
    if (role.billing === 'lead' && bank > 44) {
      const points = clamp((bank - 44) / M.K.grossPointsDivisor, 0, M.K.grossPointsMax);
      const gross = rec.gross * (role.era ?? 1);
      if (gross > 0) {
        M.applyLifestyle(this.money, points * gross);
        if (points * gross > 4) {
          this.say(`Your points on ${role.title} paid $${(points * gross).toFixed(1)}M.`, 'good');
        }
      }
    } else if (rec.roi > 1.6) {
      M.applyLifestyle(this.money, 0.06 * role.budgetForRole * (rec.roi - 1.6));
    }
    project.director.affinity = clamp(
      project.director.affinity + (rec.notices > 66 ? 9 : rec.notices > 52 ? 4 : -2), -100, 100,
    );
    project.director.sharedProjects += 1;

    if (project.credit) {
      project.credit.gross = rec.gross * (role.era ?? 1);
      project.credit.roi = rec.roi;
    }

    const card = {
      project, rec, deltas, staleness,
      landmark: project.landmark,
      headline: this._headline(rec, project),
      attribution: this._attribute(rec, project),
    };
    this.say(card.headline, rec.roi > 1.2 || rec.notices > 68 ? 'good' : 'note');

    // Awards eligibility is banked for the season.
    if (role.billing !== 'bit') {
      this.awards.thisSeason.push({ project, rec, role });
    }
    return card;
  }

  _headline(rec, p) {
    const t = p.role.title;
    const lead = p.role.billing === 'lead';
    const pick = (arr) => arr[this.rng.int(0, arr.length - 1)];

    if (rec.roi > 2.2 && rec.notices > 66) {
      return pick([
        `${t} is a hit and you are the reason people say they liked it.`,
        `${t} is the picture of the year and your name is above the reviews.`,
        `Queues for ${t}. Two critics call your performance the whole engine of it.`,
      ]);
    }
    if (rec.roi > 2.2) {
      return pick([
        `${t} made a great deal of money. Nobody mentions you.`,
        `${t} is enormous. The reviews are about the effects.`,
        `${t} sells out everywhere and you are third in the paragraph.`,
      ]);
    }
    if (rec.roi < 0.6 && rec.notices > 68) {
      return pick([
        `${t} died on release. Your reviews are the best of your life.`,
        `Nobody went to ${t}. Everyone who did wrote about you.`,
        `${t} lost its money in a fortnight and made your reputation.`,
      ]);
    }
    if (rec.roi < 0.6) {
      return pick([
        `${t} came and went in eleven days.`,
        `${t} opened against something enormous and was gone by the Tuesday.`,
        `${t} went out on ninety screens and came back off them.`,
      ]);
    }
    if (rec.notices > 72) {
      return pick([
        `${t} opened modestly. Two critics single you out.`,
        `${t} is fine. You are not fine, you are extraordinary, and it is noticed.`,
        `The reviews for ${t} spend a paragraph each on ${lead ? 'you' : 'your fifteen minutes'}.`,
      ]);
    }
    if (rec.notices < 42) {
      return pick([
        `${t} opened. You are mentioned once, in a list.`,
        `${t} came out. Nobody writes about your part of it.`,
        `${t} exists now, with you in it, apparently.`,
      ]);
    }
    if (rec.filmCritic > 70 && rec.audience < 48) {
      return `${t} is the sort of film critics defend and nobody sees.`;
    }
    if (rec.filmCritic < 45 && rec.audience > 62) {
      return `${t} is loved by everyone except the people paid to write about it.`;
    }
    return pick([
      `${t} opened to roughly what everyone expected.`,
      `${t} came out and the world stayed the same shape.`,
      `${t} did what the tracking said it would do.`,
    ]);
  }

  // §0.3 Rule 2: every outcome ships with an attribution.
  _attribute(rec, p) {
    const parts = [];
    if (rec.wrecked) parts.push('The cut is not the film you shot.');
    if (rec.blessed) parts.push('Someone in post did you an enormous favour.');
    if (p.shaped.floorBound) parts.push('You did almost nothing and the camera stayed on you anyway.');
    if (p.resolved.overspend > 0) parts.push('You were holding more ideas than you could carry; one review says "mannered".');
    if (p.resolved.generosity > 0) parts.push('You gave your scene partner the moment. They know.');
    if (p.resolved.upstaging > 0) parts.push('You took the scene. They know that too.');
    if (rec.palette.crit < -3 && rec.palette.aud > 3) parts.push('The film is exactly what audiences wanted and exactly what critics distrust.');
    if (p.film.coherence < 35) parts.push(`It never decided what it was (coherence ${p.film.coherence.toFixed(0)}).`);
    if (p.landmark) parts.push('And people are going to be copying this for a decade.');
    if (rec.clicheHit) parts.push(`Two reviews use the word "derivative". The shape is eight years old now (−${rec.clicheHit.toFixed(0)}).`);
    if (p.festival) parts.push('It played a festival first, which is why the critics are warm and the opening was not.');
    if (p.role.improvised) parts.push('Some of what is on screen was not written.');
    if (p.role.rewritten) parts.push('You had the part rewritten. That is your version up there.');
    if (p.role.takeScale) parts.push('You did it for nothing, which is why it exists.');
    if (!parts.length) parts.push('It is what it is: a film, released, absorbed.');
    return parts;
  }

  // ------------------------------------------------------------------ season
  runAwardsSeason(opts = {}) {
    const a = this.actor;
    const results = [];
    const campaignSpend = opts.campaignSpend ?? this.campaignSpend;
    const categoryFraud = opts.categoryFraud ?? this.categoryFraud;
    if (campaignSpend > 0) {
      this.money.net -= campaignSpend;
      this.blocksBooked = Math.min(4, this.blocksBooked + 1);
    }

    const contenders = this.awards.thisSeason.length;
    for (const entry of this.awards.thisSeason) {
      const flags = {
        due: this.awards.nominations >= 3 && this.awards.wins === 0,
        // Voters notice a person who is always campaigning.
        overexposed: this.awards.thisSeason.length >= 4 || this.campaignStreak >= 3,
        transformation: entry.project.prepFlag === 'transformation',
        comeback: this._wasCold(),
        finalBow: a.age >= 70,
        newcomer: this.awards.nominations === 0 && a.age < 28,
        tooCommercial: this._recentTentpoles() >= 2,
      };
      // Money only moves a performance people are already arguing about; you
      // cannot buy a nomination for something nobody rated.
      const campaignable = entry.rec.notices > 58 ? campaignSpend : campaignSpend * 0.15;
      const buzz = M.buzzScore(this.rng, {
        notices: entry.rec.notices,
        filmCritic: entry.rec.filmCritic,
        campaignSpend: campaignable / (1 + 0.6 * this.campaignStreak),
        prestige: a.standing.prestige,
        flags,
        categoryAdvantage: categoryFraud && entry.role.billing === 'lead' ? 18 : 0,
      });
      if (this.rng.chance(M.nominationChance(buzz.value))) {
        this.awards.nominations += 1;
        const won = this.rng.chance(clamp(M.K.winBase + (buzz.value - 70) / 260, 0.05, 0.45));
        if (won) {
          this.awards.wins += 1;
          a.standing.prestige = clamp(a.standing.prestige + 9, 0, 100);
          a.standing.heat = clamp(a.standing.heat + 7, 0, 100);
        }
        results.push({
          title: entry.project.role.title,
          won,
          narratives: buzz.narratives,
          category: categoryFraud && entry.role.billing === 'lead' ? 'supporting' : entry.role.billing,
          rival: this._rivalWinner(entry, won),
        });
        this.say(
          won ? `You won for ${entry.project.role.title}.`
              : `Nominated for ${entry.project.role.title}.`,
          'good',
        );
        if (categoryFraud && entry.role.billing === 'lead' && this.rng.chance(0.35)) {
          a.standing.notoriety = clamp(a.standing.notoriety + 6, 0, 100);
          this.say('The trades call out the category. It is not a good look.', 'bad');
        }
      }
    }
    this.awards.thisSeason = [];
    this.lastSeason = { results, contenders, spent: campaignSpend };
    return results;
  }

  // Somebody won it. If it was not you, it was a person with a name.
  _rivalWinner(entry, won) {
    if (won) return null;
    const pool = this.world.costars.filter((c) => c.heat > 25);
    const who = pool.length ? pool[this.rng.int(0, pool.length - 1)] : null;
    return who ? who.name : null;
  }

  _wasCold() {
    return this.stats.coldYears >= 4;
  }

  _recentTentpoles() {
    return this.credits.filter((c) => this.year - c.year <= 3 && c.tentpole).length;
  }

  // ------------------------------------------------------------------- year
  endYear() {
    const a = this.actor;
    const worked = this.yearBilling !== null;
    if (worked) this.stats.yearsActive += 1;

    this.runAwardsSeason();

    M.decayStanding(a.standing, this.yearBilling);
    a.recognition = clamp(a.recognition * M.K.recognitionKeep, 0, 100);

    // Aging (§4.9): the look curve, the attribute curves, the cliff.
    a.age += 1;
    if (a.age > 32) a.gates.look = clamp(a.gates.look - (a.age < 45 ? 0.9 : a.age < 60 ? 1.6 : 2.2), 5, 98);
    if (a.age > 45) a.gates.physicality = clamp(a.gates.physicality - 2, 5, 98);
    if (a.age > 60) a.gates.voice = clamp(a.gates.voice - 1, 5, 98);
    if (a.age > 55) a.attrs.presence = clamp(a.attrs.presence - 0.5, 5, 99);
    else if (worked) a.attrs.presence = clamp(a.attrs.presence + 0.4, 5, 99);
    if (worked) a.attrs.craft = clamp(a.attrs.craft + this.rng.float(0.5, 2.0), 5, 99);

    // Condition, health, burnout.
    if (this.blocksBooked >= 4) {
      a.condition = clamp(a.condition - 12, 10, 100);
      if (a.condition < 40) this.say('You are running on nothing and everyone can see it.', 'bad');
    } else {
      a.condition = clamp(a.condition + 8 * (1 - this.blocksBooked / 4), 10, 100);
    }
    a.health = clamp(a.health - Math.max(0, (a.age - 45) * 0.22) + (this.blocksBooked <= 2 ? 1.5 : -0.5), 0, 100);

    // §10.1 the health-plan cliff: you qualify by working enough in a year.
    a.insured = this.blocksBooked >= 1 && this.money.lifetime > 0.02;

    // §11.6 the ratchet, charged once: a year of living costs what your life
    // costs, whether or not you worked.
    this.money.floor = Math.max(0.02, this.money.floor * M.K.lifestyleDecay);
    this.money.net -= this.money.floor;
    if (this.money.net < 0 && !a.flags.broke) {
      a.flags.broke = this.year;
      this.say('The accountant calls. Then the accountant stops calling.', 'bad');
    }

    this.stats.coldYears = a.standing.heat < 25 ? (this.stats.coldYears || 0) + 1 : 0;
    if (this.legibility > 70 && a.standing.prestige > 55) this.stats.voiceYears += 1;

    this._tickLeverage(worked);

    if (this.yearListings === 0) this.offerlessYears += 1;
    else this.offerlessYears = 0;
    this.yearListings = 0;

    if (!worked) {
      this.idleYears += 1;
      // People leave. Most people leave.
      // People leave. But missing out is not the same as not being wanted:
      // an actor who reads for things and keeps losing them is still in the
      // industry, and the thing that ends careers is the phone not ringing at
      // all. The bounding agents caught this — someone taking whatever came
      // was being pushed out for failing auditions.
      const broke = this.money.net < 0 ? 0.10 : 0;
      // A body of work is some reason to hang on, but not much of one — the
      // people who leave late leave because there is nothing coming in.
      const invested = Math.min(0.06, this.credits.length / 400);
      const giveUp = this.offerlessYears >= 2
        && this.rng.chance(clamp(0.14 + 0.10 * this.offerlessYears + broke
          - M.standing(a.standing) / 90 - invested, 0, 0.7));
      if (giveUp) this._end('You took the other job. Everyone does, eventually.');
      if (this.idleYears >= 7 && a.age > 34) this._end('The phone simply stopped.');
    } else {
      this.idleYears = 0;
    this.offerlessYears = 0;   // years in which nothing at all was offered
    this.yearListings = 0;
    }
    if (a.age >= 80 || a.health <= 0) this._end('Age, in the end.');

    this.blocksBooked = 0;
    this.yearBilling = null;
  }

  // Everything the pull layer accrued this year, resolved. None of it is a
  // prompt; all of it is consequence.
  _tickLeverage(worked) {
    const a = this.actor;

    // §6.4 you cannot cool off while you are the face of a live property. The
    // audience sees you on a bus shelter whether or not you worked this year,
    // and that is what being indispensable actually feels like.
    if (this.franchise && !this.franchise.writtenOut && this.franchise.identification > 30) {
      const floor = clamp(18 + 0.45 * this.franchise.identification, 0, 82);
      if (a.standing.heat < floor) a.standing.heat = floor;
      // Identification is continuity. Skip an installment and the audience
      // starts to think of the part rather than of you.
      const done = this.franchise.installments >= this.franchise.maxInstallments;
      if (done && !this.franchise.rebooted) {
        this.franchise.rebooted = true;
        this.say(`They are rebooting ${this.franchise.title} without you.`, 'bad');
      }
      const workedIt = !done && this.credits.some((c) => c.year === this.year && c.tentpole);
      this.franchise.identification = clamp(
        this.franchise.identification
          - (workedIt ? M.K.franchiseKeepDecay : M.K.franchiseSkipDecay)
          - (this.franchise.rebooted ? 4 : 0), 0, 100,
      );
      if (this.franchise.identification < 12) {
        this.say(`Nobody thinks of you as ${this.franchise.title} any more.`, 'note');
        this.franchise = null;
      }
    }

    // A bounded break ends on its own; a vanishing does not.
    if (this.hiatus && this.hiatusUntil !== null && this.year >= this.hiatusUntil) {
      this.hiatus = false;
      this.hiatusUntil = null;
      this.say('You go back to work. Nobody made a thing of it.', 'note');
    }

    // Scarcity — you are worth more when you are not available (§6.6).
    if (!worked && !this.hiatus) this.scarcity = clamp(this.scarcity + 4, 0, 40);
    else this.scarcity = clamp(this.scarcity - 8, 0, 40);

    // People drift, and people die.
    const gone = this.rolodex.tickYear(this.year, this.rng);
    for (const e of gone) {
      if (e.favours > 0) {
        this.say(`${e.person.name} died owing you ${plural(e.favours, 'favour')}. That is gone now.`, 'bad');
      } else if (e.sharedProjects > 1 || e.affinity > 40) {
        this.say(`${e.person.name} died. You made ${plural(e.sharedProjects, 'film')} together.`, 'bad');
      }
    }

    // Mentees grow into the industry. In twenty years one of them may be the
    // most powerful person you know, and they will remember who taught them.
    for (const m of this.mentees) {
      const years = this.year - m.since;
      m.power = clamp(m.power + this.rng.float(1.5, 5.5) + years * 0.12, 0, 100);
      m.person.heat = clamp(m.person.heat + this.rng.float(0, 3.5), 0, 100);
      if (m.power > 55 && !m.announced) {
        m.announced = true;
        this.say(`${m.person.name}, who you taught, is running things now.`, 'good');
      }
    }
    if (this.mentees.length) this.blocksBooked = Math.min(4, this.blocksBooked + 0);

    // Positions pay in kind, not in prompts.
    if (this.positions.has('guild')) {
      a.standing.affection = clamp(a.standing.affection + 1.2, 0, 100);
      this.money.net += 0.02;
    }
    if (this.positions.has('juror') && this.rng.chance(0.4)) {
      a.standing.prestige = clamp(a.standing.prestige + 1.5, 0, 100);
    }
    if (this.positions.has('teacher')) {
      if (this.rng.chance(0.5)) {
        const student = this.world.makeNewcomer(this.rng);
        this.mentees.push({ person: student, since: this.year, power: 0 });
      }
      a.standing.prestige = clamp(a.standing.prestige + 0.8, 0, 100);
    }
    if (this.positions.has('prodco')) this.money.net -= 0.05;

    // Development. One resolution a year per project — never a slate to tend.
    for (const script of this.development.slice()) {
      if (!script.shopped) continue;
      if (this.rng.chance(script.financingChance)) {
        const role = this.world.generateRole(a, { billing: 'lead' });
        role.title = script.title;
        role.genre = script.genre;
        role.scriptQuality = script.quality;
        role.archetype = script.archetype;
        role.charAge = script.charAge;
        role.path = 'direct';
        role.chance = 1;
        role.yours = true;
        role.difficulty = 0;
        role.fit = M.fitScore(a, role);
        role.utility = 100;
        // You are a producer on it, which means a share of the upside and a
        // stake you do not get back if it does not work.
        role.producerShare = this.positions.has('prodco') ? 0.08 : 0.045;
        const stake = clamp(Math.min(this.money.net * 0.18, role.budget * 0.06), 0, 12);
        if (stake > 0.01) {
          this.money.net -= stake;
          role.producerStake = stake;
          this.say(`Getting ${script.title} made cost you $${stake.toFixed(2)}M of your own.`, 'note');
        }
        this.board.unshift(role);
        this.development = this.development.filter((x) => x.id !== script.id);
        this.say(`${script.title} is financed. You are in it because you made it exist.`, 'good');
      } else {
        script.financingChance *= 0.72;
        if (script.financingChance < 0.04) {
          this.development = this.development.filter((x) => x.id !== script.id);
          this.say(`${script.title} is dead. Four years and it never got made.`, 'bad');
        }
      }
    }

    this.campaignStreak = this.campaignedThisYear ? this.campaignStreak + 1 : 0;
    this.campaignedThisYear = false;
    this.campaignSpend = 0;
    this.categoryFraud = false;
  }

  _end(reason) {
    this.over = true;
    this.endReason = reason;
  }

  // What the trades printed this year.
  tradePaper() {
    return this.world.tradePaper(this);
  }

  // ------------------------------------------------------------------ a life
  arcState(id) {
    if (!this.arcs[id]) this.arcs[id] = { level: 0, stage: 0, started: null, done: false };
    return this.arcs[id];
  }

  // One thing a year, at most. An arc that has reached a threshold takes
  // precedence over a one-shot event, because it has been building.
  rollEvent() {
    if (this.pendingEvent) return this.pendingEvent;
    const surfaced = tickArcs(this);
    if (surfaced) {
      this.pendingEvent = {
        kind: 'arc',
        id: surfaced.arc.id,
        index: surfaced.index,
        prompt: arcPrompt(surfaced.arc, surfaced.stage, this),
        options: surfaced.stage.options.map((o) => o.label),
      };
      return this.pendingEvent;
    }
    const event = pickLifeEvent(this);
    if (!event) return null;
    this.pendingEvent = {
      kind: 'event',
      id: event.id,
      prompt: eventPrompt(event, this),
      options: event.options.map((o) => o.label),
    };
    return this.pendingEvent;
  }

  resolveEvent(index) {
    const pending = this.pendingEvent;
    if (!pending) return null;
    this.pendingEvent = null;

    if (pending.kind === 'arc') {
      const arc = ARCS_BY_ID[pending.id];
      if (!arc) return null;
      const stage = arc.stages[pending.index];
      const state = this.arcState(arc.id);
      const option = stage.options[clamp(index, 0, stage.options.length - 1)];
      const who = arc.who ? arc.who(this) : null;
      option.run(this, this.rng, who);
      state.stage = pending.index + 1;
      if (option.text) this.say(option.text, 'life');
      // The afterword closes the arc, so it has to come after the choice that
      // closed it.
      if (stage.terminal || state.stage >= arc.stages.length) {
        state.done = true;
        const after = arc.afterword ? arc.afterword(this) : null;
        if (after) this.say(after, 'life');
      }
      return { text: option.text, label: option.label };
    }

    const event = LIFE_EVENTS.find((e) => e.id === pending.id);
    if (!event) return null;
    const option = event.options[clamp(index, 0, event.options.length - 1)];
    this.firedEvents.add(event.id);
    option.run(this);
    if (option.text) this.say(option.text, 'life');
    return { text: option.text, label: option.label };
  }

  // §11.8 the obituary: the one place the private numbers become public, and
  // §0.6 — it remembers what you turned down.
  obituary() {
    const a = this.actor;
    const best = this.credits.length ? this.credits[Math.floor(this.credits.length / 2)] : null;
    const amb = this.ambitionReport();
    const landmarks = this.world.landmarks.filter((l) => l.author === a.name);
    const bigMiss = this.turnedDown.slice().sort((x, y) => y.budget - x.budget)[0];
    const biggest = this.credits.filter((c) => c.gross != null)
      .sort((x, y) => y.gross - x.gross)[0];
    const lines = [
      `${a.name}, ${a.age}. ${this.credits.length} credits over ${this.stats.yearsActive} working years.`,
      this.awards.wins > 0
        ? `${this.awards.wins} win${this.awards.wins > 1 ? 's' : ''} from ${this.awards.nominations} nomination${this.awards.nominations > 1 ? 's' : ''}.`
        : this.awards.nominations > 0
          ? `Nominated ${this.awards.nominations} time${this.awards.nominations > 1 ? 's' : ''}. Never won.`
          : 'Never nominated.',
      `Lifetime earnings $${this.money.lifetime.toFixed(1)}M. ${this.money.net < 0 ? 'Died owing money.' : `Left $${this.money.net.toFixed(1)}M.`}`,
      best ? `The obituaries all lead with ${best.title} (${best.year}).` : 'The obituaries are short.',
      biggest && biggest.gross > 40
        ? `The biggest thing they were ever in was ${biggest.title}, which took $${biggest.gross.toFixed(0)}M.`
        : null,
      this.stats.leadCredits === 0
        ? (this.credits.length > 25
          ? 'Never carried a film. Was in a great many of them.'
          : this.credits.length > 4
            ? 'Never carried a film. Was reliably good in other people\'s.'
            : 'It did not really happen for them.')
        : `Carried ${plural(this.stats.leadCredits, 'film')}.`,
      `They wanted ${amb.label}. ${
        { Achieved: 'They got it', Nearly: 'They came close', Sometimes: 'Now and then, they got it',
          No: 'They did not get it', 'Too early to say': 'There was not time' }[amb.grade] || amb.grade
      }: ${amb.measure} ${amb.value}.`
        + (this.ambitionChangedAt ? ` They wanted something else until ${this.ambitionChangedAt}.` : ''),
      landmarks.length
        ? `${landmarks[0].name} changed what films looked like${landmarks[0].cliche ? ', and then everyone did it until it was a joke' : ''}.`
        : null,
      this.favours > 6
        ? `${this.favours} people owed them something at the end. Most of it was never called in.`
        : null,
      this.mentees.some((m) => m.power > 55)
        ? `${this.mentees.filter((m) => m.power > 55).length} of the people they taught run things now.`
        : null,
      bigMiss ? `They turned down ${bigMiss.title} in ${bigMiss.year}. It was a $${bigMiss.budget.toFixed(0)}M picture.` : null,
      a.flags.sober ? `Sober from ${a.flags.sober}.`
        : this.arcState('drinking').level > 14 ? 'The drinking was never really dealt with.' : null,
      a.flags.uninsurable ? 'Uninsurable for the last of it, which ended the work before the life ended.' : null,
      this.positions.size ? `Also: ${[...this.positions].join(', ')}.` : null,
      this.endReason || '',
    ];
    this.obituaryText = lines.filter(Boolean);
    return this.obituaryText;
  }
}


/* ===== web/app.js ===== */
// CALLBACK — the front end. All rules live in ../engine; this file only asks
// questions and draws answers.
//
// Two kinds of screen, and the difference is the whole design:
//   PUSH — the game stops and asks you something. Budgeted, ~5 a year.
//   PULL — you open the moves menu because you want to. Unbudgeted, ~30 verbs.





const stage = document.getElementById('stage');
const hud = document.getElementById('hud');
const ledger = document.getElementById('ledger');

let game = null;
let choice = {};
let showAllMoves = false;

const SAVE_KEY = 'callback.save.v1';

// Opened straight from a file, a browser gives the page an opaque origin and
// no storage. The game still runs; it just cannot remember. Say so once rather
// than swallowing every write and letting someone lose a forty-year career.
const storageWorks = (() => {
  try {
    localStorage.setItem('callback.probe', '1');
    localStorage.removeItem('callback.probe');
    return true;
  } catch { return false; }
})();

// Every mutating call goes through the journal, and the journal is the save.
function act(name, args = []) {
  const out = game.call(name, args);
  persist();
  return out;
}

// A handle for tooling: the screenshot pass and the save test drive the real
// game object rather than guessing at the DOM. Harmless in play.
function expose() {
  window.__callback = { get game() { return game; }, screens: { screenQuarter, screenYearSummary } };
}

function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(game.save())); } catch { /* full or blocked */ }
}

function storedSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch { /* nothing to do */ }
}

// ---------------------------------------------------------------------------
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== false) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
};
const clear = () => { stage.replaceChildren(); };
// DOM append() turns a null child into the string "null", so everything that
// reaches the page goes through here.
const put = (...kids) => stage.append(...kids.filter((k) => k != null));
const money = (m) => (Math.abs(m) >= 1 ? `$${m.toFixed(1)}M` : `$${Math.round(m * 1000)}K`);
// Box office is quoted the way the trades quote it: round numbers, and billions
// once a picture gets there.
const boxOffice = (m) => (m >= 1000 ? `$${(m / 1000).toFixed(2)}B`
  : m >= 10 ? `$${m.toFixed(0)}M` : `$${m.toFixed(1)}M`);
const count = (n, one, many) => `${n} ${n === 1 ? one : many || `${one}s`}`;
const genreName = (g) => GENRE_NAMES[g] || g;
const article = (word) => `${/^[aeiou]/i.test(word) ? 'an' : 'a'} ${word}`;
const quarterName = (q) => ['', 'Q1 — winter', 'Q2 — spring', 'Q3 — summer', 'Q4 — autumn'][q];

function drawHud() {
  if (!game) return;
  hud.hidden = false;
  ledger.hidden = false;
  const a = game.actor;
  document.getElementById('hud-name').textContent = a.name;
  document.getElementById('hud-when').textContent =
    `${a.age} · ${game.year} ${quarterName(game.quarter)} · ${game.blocksBooked}/4 blocks`
    + (game.hiatus ? ' · away' : '');
  for (const k of ['heat', 'prestige', 'affection', 'notoriety']) {
    document.getElementById(`m-${k}`).style.width = `${a.standing[k]}%`;
    document.getElementById(`v-${k}`).textContent = a.standing[k].toFixed(0);
  }
  document.getElementById('hud-quote').textContent = `quote ${money(a.quote)}`;
  document.getElementById('hud-money').textContent =
    `${money(game.money.net)} banked · ${money(game.money.lifetime)} lifetime`;

  const log = document.getElementById('log');
  log.replaceChildren(...game.log.slice(-16).reverse().map(
    (e) => el('li', { class: e.kind }, `${e.year} · ${e.text}`),
  ));
  drawState();
}

// The quiet panel: everything you are carrying, none of it demanding anything.
function drawState() {
  const box = document.getElementById('state');
  if (!box) return;
  const g = game;
  const amb = g.ambitionReport();
  const bits = [
    ['Ambition', amb.value === '—'
      ? `${amb.label} — too early to say`
      : `${amb.label} — ${amb.value} (${amb.grade.toLowerCase()})`],
    ['Standing', g.standing.toFixed(0)],
    ['Legibility', `${g.legibility.toFixed(0)} — ${g.legibility < 36 ? 'unreadable'
      : g.legibility > 70 ? 'typecast' : 'known for a few things'}`],
    ['Favours owed you', g.favours.toFixed(0)],
    g.scarcity > 0 ? ['Scarcity', g.scarcity.toFixed(0)] : null,
    g.franchise && !g.franchise.writtenOut
      ? ['Franchise', `${g.franchise.title} — identification ${g.franchise.identification.toFixed(0)}`] : null,
    g.approvals.size ? ['Approvals', [...g.approvals].join(', ')] : null,
    g.positions.size ? ['Positions', [...g.positions].join(', ')] : null,
    g.development.length ? ['In development', g.development.map((s) => s.title).join(', ')] : null,
    g.mentees.length ? ['Taught', g.mentees.map((m) => `${m.person.name} (${m.power.toFixed(0)})`).join(', ')] : null,
    g.information.length ? ['You know things about', g.information.map((i) => i.about.name).join(', ')] : null,
  ].filter(Boolean);
  box.replaceChildren(...bits.map(([k, v]) => el('div', { class: 'statline' },
    el('span', {}, k), el('b', {}, v))));
}

// ---------------------------------------------------------------------------
// The moves menu — pull. Reachable from anywhere, never prompted.
// ---------------------------------------------------------------------------
function movesPanel(ctx, redraw) {
  const all = game.moves(ctx);
  const shown = showAllMoves ? all : all.slice(0, 5);
  const wrap = el('div', { class: 'moves' },
    el('h3', { class: 'section' },
      `What you could do — ${all.length} available`,
      el('button', {
        class: 'tiny',
        onclick: () => { showAllMoves = !showAllMoves; redraw(); },
      }, showAllMoves ? 'show fewer' : 'show all'),
    ),
  );
  if (!all.length) {
    wrap.append(el('p', { class: 'why' }, 'Nothing you can make happen from here today.'));
    return wrap;
  }
  for (const { action } of shown) {
    wrap.append(el('div', {
      class: 'card pick move',
      onclick: () => {
        const res = act('do', [action.id, Game.ctxRef(ctx)]);
        drawHud();
        showAllMoves = false;
        redraw(res.text);
      },
    },
      el('h4', {}, action.label),
      el('div', { class: 'meta' }, `${action.category} · costs: ${action.cost(game)}`),
      el('p', { class: 'why' }, action.blurb),
    ));
  }
  return wrap;
}

// What a position on a dial reads as, in words rather than numbers. Craft
// knowledge — it tells you what the choice IS, never what the outcome will be.
function readsAs(dial, pos, genre) {
  const [forYou, forFilm] = READ[dial][pos];
  const weight = (GENRE_DIAL_WEIGHT[genre] || {})[dial] ?? 1;
  const mine = forYou * weight;
  const noun = {
    energy: ['still', 'kinetic'], volume: ['quiet', 'loud'],
    warmth: ['cold', 'warm'], speed: ['slow', 'quick'],
  }[dial];
  const phrases = {
    with: 'part of the texture',
    beneath: `the ${noun[0]} inside it`,
    beyond: `the most ${noun[1]} thing on screen`,
    against: 'counterpoint — the thing they quote',
  };
  const you = mine > 3.2 ? 'memorable' : mine > 1.8 ? 'noticed' : 'invisible';
  const film = forFilm > 0.8 ? 'helps the film' : forFilm < -0.4 ? 'costs the film' : 'neutral for the film';
  return `${phrases[pos]} — ${you}, ${film}`;
}

function currencyBars(resolved) {
  const bar = (label, value, max, cls) => el('div', { class: 'currency' },
    el('span', {}, label),
    el('div', { class: 'track' },
      el('i', { class: cls, style: `width:${clampPct(value, max)}%` })),
  );
  return el('div', { class: 'currencies' },
    bar('for your reviews', resolved.forYou, 18, 'you'),
    bar('for the film', resolved.forFilm, 8, 'film'),
  );
}
const clampPct = (v, max) => Math.max(2, Math.min(100, (v / max) * 100));

// ---------------------------------------------------------------------------
// 1. character creation
// ---------------------------------------------------------------------------
function screenCreate() {
  clear();
  hud.hidden = true;
  ledger.hidden = true;
  let picked = 'conservatory';
  let ambition = 'work';
  const saved = storedSave();

  const render = () => {
    clear();
    put(
      el('h1', {}, 'Callback'),
      el('p', { class: 'lede' },
        'You are an actor. The work is the game: what you take, how you play it, and what the '
        + 'industry decides that means. Nobody will ever tell you how good you were.'),
      storageWorks ? null : el('div', { class: 'card' },
        el('h4', {}, 'This copy cannot save'),
        el('p', { class: 'why' },
          'You opened the file directly, so the browser has given the page no storage. '
          + 'The game plays fine — it just will not remember the career when you close the tab. '
          + 'Open the hosted link instead if you want to keep one.')),
      saved ? el('div', { class: 'card pick', onclick: () => resume(saved) },
        el('h4', {}, 'Carry on with the career you were having'),
        el('div', { class: 'meta' },
          `${saved.name || 'unnamed'} · ${saved.journal.length} decisions so far`),
        el('p', { class: 'why' }, 'Picks up exactly where you left it.')) : null,
      el('h3', { class: 'section' }, 'Where you are starting from'),
      el('div', { class: 'grid2' }, Object.entries(BACKGROUNDS).map(([key, bg]) => el('div', {
        class: 'card pick',
        style: picked === key ? 'border-color: var(--accent)' : '',
        onclick: () => { picked = key; render(); },
      },
        el('h4', {}, bg.label),
        el('div', { class: 'meta' }, `age ${bg.age} · ${bg.unionCredits}/3 union credits · ${
          bg.agent === 'none' ? 'no agent' : bg.agent} · ${money(bg.money)}`),
        el('p', { class: 'why' }, bg.blurb),
        el('div', { class: 'tags' }, Object.entries(bg.attrs).map(
          ([k, v]) => el('span', { class: 'tag' }, `${k} ${v}`))),
      ))),
      el('h3', { class: 'section' }, 'What you want it to have been for'),
      el('p', { class: 'why' },
        'This gates nothing. It decides what the obituary measures you against, and you can '
        + 'change it once.'),
      el('div', { class: 'grid2' }, Object.entries(AMBITIONS).map(([key, a]) => el('div', {
        class: 'card pick',
        style: ambition === key ? 'border-color: var(--accent)' : '',
        onclick: () => { ambition = key; render(); },
      },
        el('h4', {}, a.label),
        el('p', { class: 'why' }, a.blurb),
        el('div', { class: 'meta' }, `measured by ${a.measure.replace(/,$/, '')}`),
      ))),
    );

    const nameInput = el('input', { placeholder: 'a name, or leave it blank', class: 'text' });
    const seedInput = el('input', { placeholder: 'seed', class: 'text short' });
    put(
      el('h3', { class: 'section' }, 'Who you are'),
      el('div', {}, nameInput, seedInput),
      el('div', { style: 'margin-top:20px' }, el('button', {
        class: 'primary',
        onclick: () => {
          const seed = seedInput.value ? Number(seedInput.value) : Math.floor(Math.random() * 1e9);
          game = new Game({
            seed, background: picked, ambition,
            name: nameInput.value.trim() || undefined,
          });
          game.say(`${BACKGROUNDS[picked].label}. ${game.year}. Nobody knows your name yet.`);
          persist();
          expose();
          screenQuarter();
        },
      }, 'Start working')),
    );
  };
  render();
}

function resume(saved) {
  try {
    game = Game.load(saved);
    expose();
    game.say('You pick it up where you left it.', 'note');
    if (game.over) return screenObituary();
    screenQuarter(game.board.length === 0);
  } catch (err) {
    console.warn('save could not be replayed', err);
    clearSave();
    screenCreate();
  }
}

// ---------------------------------------------------------------------------
// 2. the quarter — the board, and the moves menu beside it
// ---------------------------------------------------------------------------
function screenQuarter(fresh = true, flash = null) {
  if (game.over) return screenObituary();
  if (fresh) act('openBoard');
  drawHud();
  clear();
  const board = game.board;

  const firstEver = !game.credits.length && !game.turnedDown.length && game.year === game.world.startYear;
  put(
    el('h2', {}, `${game.year} · ${quarterName(game.quarter)}`),
    flash ? el('p', { class: 'flash' }, flash) : null,
    firstEver ? el('div', { class: 'card intro' },
      el('p', {}, 'Your year is four blocks. Everything you take costs some of them, '
        + 'so the two things you want are always in the same months.'),
      el('p', {}, 'Read for something, pass on it, or open the moves menu below and '
        + 'make something happen that was not going to. Nothing down there is ever '
        + 'required — the game will not ask you for it and will not punish you for '
        + 'ignoring it.')) : null,
    el('p', { class: 'lede' }, boardMood(board)),
  );

  if (game.hiatus) {
    put(el('div', { class: 'card' }, el('p', {},
      'You are not working. Nobody is being told why. '
      + `Scarcity ${game.scarcity.toFixed(0)} of 40.`)));
  } else if (!board.length) {
    put(el('div', { class: 'card' }, el('p', {},
      'Nothing this quarter. Your agent says it is quiet everywhere, which is what agents say.')));
  }

  for (const r of board) {
    const noDates = game.blocksBooked + r.blocks > 4;
    const locked = r.union && game.actor.unionCredits < 3;
    const advice = ambitionAdvice(game, r);
    put(el('div', { class: 'card' },
      el('h4', {}, r.title),
      el('div', { class: 'meta' },
        `${r.billing} · ${genreName(r.genre)} · ${r.label} · $${r.budget.toFixed(0)}M · `
        + `${r.blocks} block${r.blocks > 1 ? 's' : ''} · dir. ${r.director.name}`),
      el('p', { class: 'why' }, roleBlurb(r)),
      advice ? el('p', { class: 'advice' }, advice) : null,
      el('div', { class: 'tags' },
        el('span', { class: `tag ${r.path === 'audition' ? '' : 'good'}` },
          r.viaFavour ? `${r.viaFavour} made a call`
            : r.franchiseInstallment ? 'they need you back'
            : r.yours ? 'you made this exist'
            : r.comeback ? 'they waited for you'
            : r.path === 'direct' ? `offered by ${r.director.name}`
            : r.path === 'offer' ? 'offer, no audition' : 'audition'),
        el('span', { class: 'tag' }, `fit ${r.fit.toFixed(0)}`),
        el('span', { class: 'tag' }, `they want someone about ${r.charAge}`),
        r.unknownLead ? el('span', { class: 'tag hot' }, 'they want an unknown — five-picture deal') : null,
        r.takeScale ? el('span', { class: 'tag good' }, 'you offered to do it for scale') : null,
        r.publicCampaign ? el('span', { class: 'tag warn' }, 'you said publicly you want it') : null,
        r.nonUnionNote ? el('span', { class: 'tag warn' }, 'non-union') : null,
        locked ? el('span', { class: 'tag warn' }, `union — you have ${game.actor.unionCredits}/3`) : null,
        noDates ? el('span', { class: 'tag warn' }, 'no dates') : null,
        r.path === 'audition'
          ? el('span', { class: 'tag' }, `${(100 * r.chance * fieldFor(r)).toFixed(0)}% shot`) : null,
      ),
      el('div', { class: 'row' },
        el('button', {
          class: 'primary',
          disabled: noDates || locked,
          onclick: () => attempt(r),
        }, r.path === 'audition' ? 'Read for it' : 'Take it'),
        el('button', { onclick: () => { act('decline', [r.id]); screenQuarter(false, 'Passed.'); } }, 'Pass'),
        el('button', {
          onclick: () => screenMoves({ role: r }, `About ${r.title}`),
        }, 'Do something about it'),
      ),
    ));
  }

  put(
    movesPanel({}, (text) => screenQuarter(false, text)),
    el('div', { class: 'row spaced' },
      el('button', {
        // When there is nothing to take, moving on is the obvious action and
        // should look like it.
        class: board.some((r) => game.blocksBooked + r.blocks <= 4
          && !(r.union && game.actor.unionCredits < 3)) ? '' : 'primary',
        onclick: () => advanceQuarter(),
      }, 'Let the quarter go by'),
      el('button', { onclick: () => screenRolodex() }, 'The Rolodex'),
      el('button', { onclick: () => screenOrders() }, 'Standing orders'),
    ),
  );
}

const fieldFor = (r) => (r.billing === 'lead' ? M.K.fieldLead
  : r.billing === 'supporting' ? M.K.fieldSupporting : M.K.fieldBit);

function boardMood(board) {
  const s = M.standing(game.actor.standing);
  if (game.hiatus) return 'You are away.';
  if (!board.length) return 'The phone does not ring.';
  if (game.legibility > 72) return 'Every one of these is the part you already played. That is what being legible buys.';
  if (s > 70) return 'Everything on this list wants you specifically. That is the trap and the prize.';
  if (s > 35) return 'Your agent has read all of these. Two of them she thinks are beneath you.';
  if (game.actor.unionCredits < 3) return 'Non-union work, mostly. Three credits and the real board opens.';
  return 'What is available is what is available.';
}

function roleBlurb(r) {
  const tone = { generous: 'known for being good with actors', exacting: 'known for take forty',
    chaotic: 'known for rewriting on the day', remote: 'known for not speaking to the cast' }[r.director.temperament];
  return `${r.archetype.replace(/_/g, ' ')} in a ${genreName(r.genre)} picture. ${r.director.name} is ${tone}. `
    + `Script reads ${r.scriptQuality > 72 ? 'genuinely good' : r.scriptQuality > 55 ? 'competent' : 'thin'}.`;
}

// A moves screen scoped to one thing (a listing, or the project you are on).
function screenMoves(ctx, title) {
  clear();
  drawHud();
  put(
    el('h2', {}, title),
    el('p', { class: 'lede' }, 'Nothing here is required. Nothing here will ever be asked of you.'),
    movesPanel(ctx, (text) => screenMoves(ctx, title)),
    el('button', { class: 'primary', onclick: () => (ctx.current ? screenPrep() : screenQuarter(false)) },
      'Back'),
  );
}

function attempt(role) {
  const res = act('pursue', [role.id]);
  drawHud();
  if (!res.cast) {
    clear();
    put(
      el('h2', {}, role.title),
      el('p', { class: 'lede' }, res.note || 'They went another way. You will not be told why.'),
      el('button', { class: 'primary', onclick: () => screenQuarter(false) }, 'Back to the board'),
    );
    return;
  }
  choice = { role, prep: game.standingOrders.prep, positions: null, moments: {} };
  screenPrep();
}

// ---------------------------------------------------------------------------
// 3. prep — asked only when the answer could differ
// ---------------------------------------------------------------------------
function screenPrep() {
  const r = choice.role;
  if (!game.shouldAskPrep(r)) return screenFilm(`You prepared the way you always do: ${PREP_OPTIONS[game.standingOrders.prep].label.toLowerCase()}.`);
  clear();
  drawHud();
  game.countPush('prep');
  put(
    el('h2', {}, `You are doing ${r.title}`),
    el('p', { class: 'lede' },
      `${r.billing === 'lead' ? 'Above the title.' : r.billing === 'supporting' ? 'Fourth on the call sheet.' : 'Two scenes.'} `
      + `${r.blocks} block${r.blocks > 1 ? 's' : ''}, ${money(r.budgetForRole)} in the role's budget.`),
    el('h3', { class: 'section' }, 'This one is worth thinking about'),
  );
  for (const [key, p] of Object.entries(PREP_OPTIONS)) {
    put(el('div', {
      class: 'card pick',
      style: choice.prep === key ? 'border-color: var(--accent)' : '',
      onclick: () => { choice.prep = key; screenPrep(); },
    },
      el('h4', {}, p.label),
      el('div', { class: 'meta' },
        `${p.weeks} weeks${p.health ? ` · health ${p.health}` : ''}`
        + `${p.resilience ? ` · resilience ${p.resilience}` : ''}${p.flag ? ' · award narrative' : ''}`),
    ));
  }
  put(el('div', { class: 'row' },
    el('button', { class: 'primary', onclick: () => screenFilm() }, 'To the set'),
    el('button', { onclick: () => screenMoves({ current: r }, `Before you shoot ${r.title}`) },
      'Do something about the project'),
  ));
}

// ---------------------------------------------------------------------------
// 4. the film, and your positions against it
// ---------------------------------------------------------------------------
function screenFilm(note) {
  const r = choice.role;
  if (!choice.palette) choice.palette = act('filmFor', [r.id]).palette;
  const coh = M.coherence(choice.palette);
  if (!game.shouldAskStance(r, { coherence: coh.value })) {
    choice.positions = game.autoPositions(r);
    return resolveShoot(note);
  }
  if (!choice.positions) choice.positions = game.autoPositions(r);
  game.countPush('stance');

  clear();
  drawHud();
  const budget = M.contrastBudget(game.actor.attrs.craft, r.director.command);
  const spent = PERF_DIALS.reduce((a, d) => a + POSITION_COST[choice.positions[d]], 0);

  put(
    note ? el('p', { class: 'flash' }, note) : null,
    el('h2', {}, 'The film they are making'),
    el('p', { class: 'lede' },
      `${r.director.name} is shooting something ${coh.value > 65 ? 'very much like'
        : coh.value > 40 ? 'loosely in the shape of' : 'that does not resemble'} `
      + `${article(coh.nearest.replace(/_/g, ' '))}. Coherence ${coh.value.toFixed(0)}`
      + `${coh.value < 40 ? ' — wide open. It is a mess or it is a landmark.' : '.'}`),
    el('div', { class: 'palette' }, DIALS.flatMap((d) => [
      el('div', { class: 'l' }, DIAL_LABELS[d][0]),
      el('div', { class: 'track' }, el('i', { style: `left:${((choice.palette[d] + 50) / 100) * 100}%` })),
      el('div', { class: 'r' }, DIAL_LABELS[d][1]),
    ])),
    el('h3', { class: 'section' }, 'What you play against it'),
    el('p', {},
      'With: you move as the film moves. Beneath: the calm inside it. Beyond: the most of it '
      + 'on screen. Against: counterpoint. Every position costs, and you have only so much.'),
  );

  const table = el('table', { class: 'dials' });
  for (const d of PERF_DIALS) {
    table.append(el('tr', {},
      el('td', {}, d),
      el('td', {},
        el('div', {}, POSITIONS.map((p) => el('button', {
          class: choice.positions[d] === p ? 'selected' : '',
          onclick: () => { choice.positions[d] = p; screenFilm(); },
        }, `${p} (${POSITION_COST[p]})`))),
        el('div', { class: 'reads' }, readsAs(d, choice.positions[d], r.genre)),
      ),
    ));
  }
  const resolved = M.resolvePositions(choice.positions, {
    genre: r.genre,
    craft: game.actor.attrs.craft,
    directorCommand: r.director.command,
  });
  put(table,
    currencyBars(resolved),
    el('div', { class: `budgetline${spent > budget ? ' over' : ''}` },
      `contrast budget ${budget.toFixed(1)} · spending ${spent}`
      + (spent > budget ? ' — over. Critics will call it mannered.' : '')),
    el('div', { class: 'row' },
      el('button', { class: 'primary', onclick: () => resolveShoot() }, 'Shoot it'),
      el('button', { onclick: () => screenMoves({ current: r }, `Before you shoot ${r.title}`) },
        'Do something about the project'),
    ));
}

// ---------------------------------------------------------------------------
// 5. the moments that still fire
// ---------------------------------------------------------------------------
function resolveShoot(note) {
  const prompted = game.momentsFor(choice.role);
  return runMoments(prompted, 0, note);
}

function runMoments(list, i, note) {
  if (i >= list.length) return finishShoot(note);
  clear();
  drawHud();
  game.countPush('moment');
  const m = list[i];
  put(
    note && i === 0 ? el('p', { class: 'flash' }, note) : null,
    el('h2', {}, choice.role.title),
    el('p', { class: 'lede' }, m.prompt),
  );
  for (const opt of m.options) {
    put(el('div', {
      class: 'card pick',
      onclick: () => { choice.moments[m.id] = opt.id; runMoments(list, i + 1); },
    }, el('h4', {}, opt.label)));
  }
}

function finishShoot(note) {
  const project = act('shoot', [{
    prep: choice.prep, positions: choice.positions, moments: choice.moments,
  }]);
  drawHud();
  clear();
  const unasked = project.momentLog.filter((m) => !m.asked);
  put(
    note ? el('p', { class: 'flash' }, note) : null,
    el('h2', {}, `${choice.role.title} wrapped`),
    el('p', { class: 'lede' }, game.log.filter((l) => l.kind === 'work').slice(-1)[0]?.text || ''),
    el('div', { class: 'attrib' },
      el('div', {}, project.readConfidence),
      el('div', {}, `You were paid ${money(project.fee)}.`),
      unasked.length
        ? el('div', {}, `Three months of days you have had a hundred times: ${
          unasked.map((m) => m.chose.toLowerCase()).join('; ')}.`)
        : null,
      el('div', {}, project.resolved.overspend > 0
        ? 'You were carrying more than you could hold. You could feel it in the last week.'
        : 'It held together.'),
      el('div', {}, project.landmark
        ? 'Nobody has made anything that looks like this before.'
        : `It comes out in ${project.releaseIn} quarter${project.releaseIn > 1 ? 's' : ''}.`),
    ),
    el('button', { class: 'primary', onclick: () => advanceQuarter() }, 'Next'),
  );
}

// ---------------------------------------------------------------------------
// 6. turnover
// ---------------------------------------------------------------------------
function advanceQuarter() {
  const cards = act('tickPending');
  act('tickQuarter');
  const yearRolled = game.world.quarter === 1;
  if (cards.length) return screenRelease(cards, 0, yearRolled);
  if (yearRolled) return screenYearEnd();
  screenQuarter();
}

function screenRelease(cards, i, yearRolled) {
  if (i >= cards.length) return yearRolled ? screenYearEnd() : screenQuarter();
  drawHud();
  clear();
  const c = cards[i];
  const rec = c.rec;
  put(
    el('h2', {}, `${c.project.role.title} is out`),
    el('p', { class: 'lede' }, c.headline),
    el('div', { class: 'tags' },
      el('span', { class: `tag ${rec.filmCritic > 66 ? 'good' : rec.filmCritic < 45 ? 'warn' : ''}` }, `critics ${rec.filmCritic.toFixed(0)}`),
      el('span', { class: `tag ${rec.notices > 66 ? 'good' : rec.notices < 45 ? 'warn' : ''}` }, `your notices ${rec.notices.toFixed(0)}`),
      el('span', { class: 'tag' }, `audience ${rec.audience.toFixed(0)}`),
      el('span', { class: `tag ${rec.roi > 1.4 ? 'hot' : rec.roi < 0.8 ? 'warn' : ''}` }, `roi ${rec.roi.toFixed(2)}`),
      el('span', { class: `tag ${rec.roi > 1.4 ? 'hot' : rec.roi < 0.8 ? 'warn' : ''}` },
        `box office ${boxOffice(rec.gross * (c.project.role.era ?? 1))}`),
    ),
    el('div', { class: 'attrib' }, el('div', {}, boxOfficeLine(c))),
    el('div', { class: 'attrib' }, c.attribution.map((t) => el('div', {}, t))),
    el('div', { class: 'attrib' },
      el('div', {}, `Heat ${c.deltas.dHeat >= 0 ? '+' : ''}${c.deltas.dHeat.toFixed(1)} · `
        + `Prestige ${c.deltas.dPrestige >= 0 ? '+' : ''}${c.deltas.dPrestige.toFixed(1)} · `
        + `Affection ${c.deltas.dAffection >= 0 ? '+' : ''}${c.deltas.dAffection.toFixed(1)}`),
      c.deltas.discovery > 1.05 ? el('div', {}, 'A new face counts for more than it should. Use it.') : null,
    ),
    el('button', { class: 'primary', onclick: () => screenRelease(cards, i + 1, yearRolled) }, 'Next'),
  );
}

// The trades number, and the figure it had to clear. Break-even is the budget
// plus prints and advertising, against the share of the gross that comes back —
// which is why a picture can take twice what it cost and still be spoken of as
// a disappointment. Both terms come from the model, not from here.
