<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Callback</title>
<style>
:root {
  --bg: #14110f;
  --panel: #1c1917;
  --panel-2: #232019;
  --ink: #efe7db;
  --dim: #a1968a;
  --line: #3a332c;
  --hot: #d97757;
  --good: #86a873;
  --bad: #c4635a;
  --accent: #d8b26a;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 ui-serif, Georgia, "Times New Roman", serif;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
}

header#hud {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 10px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 5;
  flex-wrap: wrap;
}

.hud-left { font-weight: 600; letter-spacing: 0.02em; }
.hud-right { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--dim); display: flex; gap: 16px; }
.dim { color: var(--dim); font-weight: 400; margin-left: 10px; font-size: 13px; }

.meters { display: flex; gap: 14px; flex-wrap: wrap; }
.meter { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
.meter .bar { width: 74px; height: 6px; background: #2c2620; border-radius: 3px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; width: 0; background: var(--hot); transition: width 0.4s ease; }
.meter span { color: var(--ink); min-width: 20px; text-align: right; }
#m-prestige { background: var(--accent) !important; }
#m-affection { background: var(--good) !important; }
#m-notoriety { background: var(--bad) !important; }

main#stage { padding: 28px 32px 80px; max-width: 940px; }

aside#ledger {
  border-left: 1px solid var(--line);
  background: var(--panel);
  padding: 18px 16px;
  font-size: 13px;
  max-height: calc(100vh - 52px);
  overflow-y: auto;
  position: sticky;
  top: 52px;
}
aside h3 { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); margin: 0 0 12px; }
#log { list-style: none; margin: 0; padding: 0; }
#log li { padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--dim); }
#log li.good { color: var(--good); }
#log li.bad { color: var(--bad); }
#log li.work { color: var(--ink); }

h1 { font-size: 30px; letter-spacing: 0.16em; margin: 0 0 4px; text-transform: uppercase; }
h2 { font-size: 21px; margin: 0 0 6px; font-weight: 600; }
h3.section { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); margin: 28px 0 10px; }
p.lede { color: var(--dim); margin: 0 0 22px; max-width: 62ch; }
p { max-width: 68ch; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px 18px;
  margin-bottom: 12px;
}
.card.pick { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.card.pick:hover { border-color: var(--accent); background: var(--panel-2); }
.card h4 { margin: 0 0 4px; font-size: 17px; }
.card .meta { font-family: var(--mono); font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
.card .why { margin: 8px 0 0; color: var(--dim); font-size: 14px; }

.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 7px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); }
.tag.hot { border-color: var(--hot); color: var(--hot); }
.tag.good { border-color: var(--good); color: var(--good); }
.tag.warn { border-color: var(--bad); color: var(--bad); }

button {
  font: 600 13px/1 ui-serif, Georgia, serif;
  background: var(--panel-2);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 10px 16px;
  cursor: pointer;
  margin: 0 8px 8px 0;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #1b1712; border-color: var(--accent); }
button.selected { border-color: var(--accent); color: var(--accent); }

table.dials { border-collapse: collapse; width: 100%; max-width: 560px; margin-top: 6px; }
table.dials td { padding: 5px 4px; border-bottom: 1px solid var(--line); }
table.dials td:first-child { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--dim); width: 90px; }
table.dials button { padding: 5px 9px; font-size: 12px; margin: 0 4px 0 0; }

.budgetline { font-family: var(--mono); font-size: 12px; color: var(--dim); margin-top: 10px; }
.budgetline.over { color: var(--bad); }

.palette { display: grid; grid-template-columns: 96px 1fr 96px; gap: 4px 10px; align-items: center; font-size: 12px; max-width: 520px; }
.palette .track { height: 5px; background: #2c2620; border-radius: 3px; position: relative; }
.palette .track i { position: absolute; top: -3px; width: 3px; height: 11px; background: var(--accent); border-radius: 1px; }
.palette .l { color: var(--dim); text-align: right; font-family: var(--mono); font-size: 10px; text-transform: uppercase; }
.palette .r { color: var(--dim); font-family: var(--mono); font-size: 10px; text-transform: uppercase; }

.attrib { border-left: 2px solid var(--accent); padding-left: 14px; margin: 14px 0; color: var(--dim); }
.attrib div { margin-bottom: 4px; }

.obit { border: 1px solid var(--line); padding: 26px 28px; background: var(--panel); max-width: 640px; }
.obit p { margin: 0 0 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; }
  aside#ledger { display: none; }
  .grid2 { grid-template-columns: 1fr; }
}

/* --- the pull layer ----------------------------------------------------- */
.moves { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 6px; }
.card.move { border-style: dashed; }
.card.move:hover { border-style: solid; }
button.tiny {
  font-size: 10px; padding: 3px 8px; margin-left: 12px; text-transform: uppercase;
  letter-spacing: 0.08em; vertical-align: middle;
}
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.row.spaced { margin-top: 22px; }
.row button { margin: 0; }
button:disabled { opacity: 0.35; cursor: not-allowed; }
button:disabled:hover { border-color: var(--line); }
p.advice { color: var(--accent); font-size: 14px; margin: 6px 0 0; font-style: italic; }
p.flash {
  color: var(--good); border-left: 2px solid var(--good); padding-left: 12px; margin: 0 0 16px;
}
input.text {
  width: 320px; padding: 9px; background: var(--panel-2); border: 1px solid var(--line);
  color: var(--ink); border-radius: 5px; font: inherit;
}
input.text.short { width: 130px; margin-left: 8px; }
#state { margin-bottom: 22px; }
.statline {
  display: flex; justify-content: space-between; gap: 10px; padding: 4px 0;
  border-bottom: 1px solid var(--line); font-size: 12px; color: var(--dim);
}
.statline b { color: var(--ink); font-weight: 500; text-align: right; }

.reads { font-size: 12px; color: var(--dim); margin-top: 3px; font-style: italic; }
.currencies { margin-top: 14px; max-width: 420px; }
.currency {
  display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center;
  font-family: var(--mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--dim); margin-bottom: 6px;
}
.currency .track { height: 6px; background: #2c2620; border-radius: 3px; overflow: hidden; }
.currency i { display: block; height: 100%; transition: width 0.25s ease; }
.currency i.you { background: var(--accent); }
.currency i.film { background: var(--good); }

.trades p { margin: 0 0 8px; color: var(--dim); font-size: 14px; }
.trades p:last-child { margin-bottom: 0; }

.card.intro { border-color: var(--accent); background: var(--panel-2); }
.card.intro p { margin: 0 0 8px; font-size: 14px; color: var(--dim); }
.card.intro p:last-child { margin-bottom: 0; }

</style>
</head>

      <span id="hud-name"></span>

<script>
"use strict";
(function () {

/* ===== engine/rng.js ===== */
// Deterministic RNG. Every career is reproducible from its seed, which is what
// makes the sim harness and the game the same system.

class RNG {
  constructor(seed = 1) {
    this.s = (seed >>> 0) || 1;
    this._spare = null;
  }

  // mulberry32
  next() {
    this.s = (this.s + 0x6d2b79f5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  float(a = 0, b = 1) {
    return a + (b - a) * this.next();
  }

  int(a, b) {
    return Math.floor(this.float(a, b + 1));
  }

  // Box-Muller, one cached spare.
  gauss(mu = 0, sd = 1) {
    if (this._spare !== null) {
      const v = this._spare;
      this._spare = null;
      return mu + sd * v;
    }
    let u = 0, v = 0, s = 0;
    do {
      u = this.float(-1, 1);
      v = this.float(-1, 1);
      s = u * u + v * v;
    } while (s === 0 || s >= 1);
    const f = Math.sqrt((-2 * Math.log(s)) / s);
    this._spare = v * f;
    return mu + sd * u * f;
  }

  chance(p) {
    return this.next() < p;
  }

  pick(arr) {
    return arr[Math.floor(this.next() * arr.length)];
  }

  weighted(entries) {
    // entries: [[value, weight], ...]
    let total = 0;
    for (const [, w] of entries) total += w;
    let r = this.next() * total;
    for (const [v, w] of entries) {
      r -= w;
      if (r <= 0) return v;
    }
    return entries[entries.length - 1][0];
  }

  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
}

const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const sig = (x) => 1 / (1 + Math.exp(-x));
const lerp = (a, b, t) => a + (b - a) * t;
const mean = (xs) => xs.reduce((a, b) => a + b, 0) / (xs.length || 1);
const median = (xs) => {
  const s = xs.slice().sort((a, b) => a - b);
  if (!s.length) return 0;
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};
const quantile = (xs, p) => {
  const s = xs.slice().sort((a, b) => a - b);
  if (!s.length) return 0;
  return s[clamp(Math.floor(p * s.length), 0, s.length - 1)];
};

const POSITIONS = ['with', 'beneath', 'beyond', 'against'];

/* ===== engine/model.js ===== */
// CALLBACK — the model.
//
// Every formula the game resolves against lives here, and nothing here touches
// the DOM or the game loop, so `sim/career-sim.mjs` and `web/app.js` are running
// the identical system.
//
// Where this departs from callback-design-doc-v8.md, it is because the design
// review found the doc's version does not produce a career. Each departure is
// marked FIX-n and explained in callback/DESIGN-DELTA.md.


// ---------------------------------------------------------------------------
// Tuned constants. Changing one of these means re-running sim/career-sim.mjs;
// several trade off sharply against each other.
// ---------------------------------------------------------------------------
const K = {
  // FIX-1 the ladder. Gains carry a base term (working at all is worth
  // something), are re-centred below the median outcome, and decay is
  // proportional rather than a flat −9 so the meters find an equilibrium.
  heatBase: 7.9,
  heatRoiCoef: 9.0,
  heatRoiCentre: 0.90,
  heatAudCoef: 0.20,
  heatAudCentre: 52,
  heatKeepIdle: 0.80,     // a year with no work
  heatKeepBit: 0.865,     // FIX-1b decay is billing-aware: the tier you can
  heatKeepSupporting: 0.888, // reach must be able to outrun the decay on it
  heatKeepLead: 0.925,

  prestigeCriticCoef: 0.11,
  prestigeCriticCentre: 57,
  prestigeNoticesCoef: 0.26,
  prestigeNoticesCentre: 54,
  prestigeKeep: 0.985,

  affectionCoef: 0.10,
  affectionCentre: 55,
  affectionKeep: 0.96,

  notorietyKeep: 0.84,

  // FIX-1c the on-ramp. Your first credits count for more than they should,
  // because a new face is news and a known quantity is not.
  discoveryCredits: 9,
  discoveryPeak: 2.4,

  // FIX-1d the bridge out of bit parts, which is deliberately NOT Standing.
  // Casting directors remember a good five minutes. Recognition is what gets
  // a nobody read for a supporting part; it does nothing for leads.
  recognitionGain: 0.42,        // per point of Notices over the centre
  recognitionCentre: 51,
  recognitionKeep: 0.90,
  recognitionUtility: 0.30,     // weight in Utility for supporting/bit roles
  recognitionFadesBy: 45,       // standing at which being remembered stops mattering
  recognitionTier: 0.20,        // how much being remembered raises the tier you are offered

  openingBase: 0.92,          // box office: opening multiple on budget
  marketingShare: 0.45,       // prints and advertising, as a share of budget
  rightsShare: 0.62,          // §4.10 what comes back to the film from a ticket
  reachBase: 0.46,
  reachCoef: 0.50,
  fieldLead: 0.34,            // audition competition, by tier
  fieldSupporting: 0.48,
  fieldBit: 0.45,

  lifestyleShare: 0.22,       // of your best single payday
  lifestyleDecay: 0.90,       // how fast the way you live comes back down

  scaleFeeBase: 0.03,         // union scale, roughly
  scaleFeeCoef: 0.038,       // and what the film's size adds to it

  grossPointsDivisor: 52,
  grossPointsMax: 0.20,      // first-dollar gross, stars only
  quoteExp: 0.070,            // steepness of the top of the market
  buzzCentre: 63,
  winBase: 0.22,

  paletteScale: 0.32,
  franchiseKeepDecay: 1.2,    // identification lost per year while you keep doing them
  franchiseSkipDecay: 6.5,    // and per year while you do not

  contrastBudgetDivisor: 28,
  landmarkCoherenceGate: 60,
};

// ---------------------------------------------------------------------------
// Standing
// ---------------------------------------------------------------------------

function starPower(s) {
  return 0.45 * s.heat + 0.30 * s.affection + 0.25 * s.prestige;
}

// FIX-3 "Standing" is used throughout Parts 6 and 8 as a scalar that the doc
// never defines. It is defined here, once, as StarPower net of scandal, and
// every threshold in the game reads this function.
function standing(s) {
  return clamp(starPower(s) - 0.20 * Math.max(0, s.notoriety - 55), 0, 100);
}

function bankability(s, recentRoi = 1) {
  return clamp(
    0.60 * s.heat + 0.25 * clamp(40 * recentRoi, 0, 100) + 0.15 * s.affection
      - 0.20 * Math.max(0, s.notoriety - 55),
    0, 100,
  );
}

function quote(s, recentRoi = 1, eraMultiplier = 1) {
  return 0.05 * Math.exp(K.quoteExp * bankability(s, recentRoi)) * eraMultiplier;
}

function discoveryMultiplier(credits) {
  if (credits >= K.discoveryCredits) return 1;
  const t = 1 - credits / K.discoveryCredits;
  return 1 + (K.discoveryPeak - 1) * t * t;
}

function heatKeep(billingThisYear) {
  switch (billingThisYear) {
    case 'lead': return K.heatKeepLead;
    case 'supporting': return K.heatKeepSupporting;
    case 'bit': return K.heatKeepBit;
    default: return K.heatKeepIdle;
  }
}

// ---------------------------------------------------------------------------
// Persona and Legibility (§4.2)
// ---------------------------------------------------------------------------

function legibility(persona) {
  const conc = (vec) => {
    const vals = Object.values(vec);
    const max = Math.max(...vals);
    if (max <= 0) return 0;
    const mn = vals.reduce((a, b) => a + b, 0) / vals.length;
    return 100 * ((max - mn) / max);
  };
  return clamp((conc(persona.genre) + conc(persona.archetype)) / 2, 0, 100);
}

function updatePersona(persona, genre, archetype, billing, audienceScore) {
  const bw = BILLING_WEIGHT[billing];
  const rf = clamp(0.4 + audienceScore / 100, 0.4, 1.6);
  for (const k of Object.keys(persona.genre)) {
    persona.genre[k] = clamp(
      persona.genre[k] + (k === genre ? 6 * bw * rf : -0.8 * bw), 0, 100,
    );
  }
  for (const k of Object.keys(persona.archetype)) {
    persona.archetype[k] = clamp(
      persona.archetype[k] + (k === archetype ? 6 * bw * rf : -0.8 * bw), 0, 100,
    );
  }
}

// ---------------------------------------------------------------------------
// Casting (§4.4)
// ---------------------------------------------------------------------------

function ageMismatchPenalty(charAge, actorAge) {
  const d = Math.abs(charAge - actorAge);
  if (d <= 4) return 0;
  const raw = 2.2 * Math.pow(d - 4, 1.35);
  const asym = charAge < actorAge ? 1.6 : 1.0; // playing younger costs more
  return Math.min(70, raw * asym);
}

function fitScore(actor, role) {
  let fit = 100;
  fit -= ageMismatchPenalty(role.charAge, actor.age);
  fit -= 0.45 * (100 - actor.persona.genre[role.genre]) * role.typeStrictness;
  fit -= 0.45 * (100 - actor.persona.archetype[role.archetype]) * role.typeStrictness;
  for (const [gate, req] of Object.entries(role.gates || {})) {
    const have = actor.gates[gate] ?? 50;
    if (have < req) fit -= 0.6 * (req - have);
  }
  return clamp(fit, 0, 100);
}

function utility(actor, role, relationshipBonus = 0) {
  const g = GATEKEEPERS[role.gatekeeper];
  const standingScore = clamp(
    g.heat * actor.standing.heat + g.prestige * actor.standing.prestige
      + g.affection * actor.standing.affection + g.notoriety * actor.standing.notoriety,
    0, 100,
  );
  const fit = fitScore(actor, role);
  const craftTerm = 0.6 * actor.attrs.craft + 0.4 * actor.attrs.instinct;

  // FIX-1d Recognition only opens the lower two tiers, and it fades as you
  // acquire standing of your own. It is a way IN, not a way up: being the
  // person who was good in that one scene gets an unknown read for the
  // supporting part, and means nothing at all once you are somebody.
  const standingNow = starPower(actor.standing);
  const stillUseful = clamp(1 - standingNow / K.recognitionFadesBy, 0, 1);
  const recog = role.billing === 'lead'
    ? 0
    : K.recognitionUtility * actor.recognition * stillUseful;

  // You are too expensive for this film. Capped, because an actor who wants a
  // part takes less for it, and the doc's uncapped version priced working
  // actors out of the entire board the moment their quote moved.
  const overpriced = clamp(
    5 * (actor.quote / Math.max(0.05, role.budgetForRole) - 1), 0, 12,
  );

  return 0.40 * standingScore + 0.35 * fit + 0.15 * craftTerm
    + recog + relationshipBonus - overpriced;
}

function offerProbability(u, difficulty) {
  return sig(0.11 * (u - difficulty));
}

// FIX-6 the doc's "offer" path (Utility − difficulty > 25) is unreachable
// without relationships, which makes it the same path as path 3. The threshold
// is expressed against the role's own difficulty instead, so a star who is
// obvious casting for a small film gets offered it outright.
function castingPath(u, role, relationshipBonus) {
  if (relationshipBonus >= 18) return 'direct';
  if (u - role.difficulty > 14) return 'offer';
  return 'audition';
}

// ---------------------------------------------------------------------------
// The film: palette, coherence, landmarks (§5.3–§5.4)
// ---------------------------------------------------------------------------

// §5.3 says palette effects run about +-7-10 on AudienceScore against a base
// sd of 7.6 — "a major factor, never the only one". K.paletteScale is what
// holds them there; at 1.0 the palette swamps every other reception term and
// critics and crowds stop agreeing at all.
function paletteEffect(palette, genre) {
  const w = PALETTE_WEIGHTS[genre];
  let aud = 0, crit = 0;
  for (const d of DIALS) {
    aud += (w.aud[d] * palette[d]) / 100;
    crit += (w.crit[d] * palette[d]) / 100;
  }
  return { aud: aud * K.paletteScale, crit: crit * K.paletteScale };
}

function coherence(palette) {
  let best = Infinity, bestName = null;
  for (const [name, shape] of Object.entries(SHAPES)) {
    let sum = 0;
    for (const d of DIALS) sum += (palette[d] - shape[d]) ** 2;
    const dist = Math.sqrt(sum / DIALS.length);
    if (dist < best) { best = dist; bestName = name; }
  }
  return { value: clamp(100 - 2.2 * best, 0, 100), nearest: bestName };
}

function landmarkChance(coh, skill) {
  if (coh >= K.landmarkCoherenceGate || skill <= 70) return 0;
  return clamp(0.02 + 0.00022 * (K.landmarkCoherenceGate - coh) * (skill - 70), 0, 0.20);
}

// ---------------------------------------------------------------------------
// The performance (§4.7 + §5.5–§5.7)
//
// FIX-2 Part 5 and Part 4 defined Notices and Ensemble as different quantities
// and never reconciled them. There is now exactly one of each, produced here
// and consumed as terms inside reception() below.
// ---------------------------------------------------------------------------

function contrastBudget(craft, directorCommand) {
  return (craft + directorCommand) / K.contrastBudgetDivisor;
}

function performance(rng, ctx) {
  const { actor, role, film, prep, chemistry, condition, directorSkill } = ctx;
  const a = actor.attrs;
  const fit = ctx.fit ?? fitScore(actor, role);

  const base = 0.28 * a.craft + 0.18 * a.instinct + 0.16 * a.presence
    + 0.16 * fit + 0.12 * prep + 0.10 * chemistry;
  const directionMult = 0.86 + 0.0028 * directorSkill;
  const conditionMult = 0.80 + 0.0020 * condition;
  const sigma = Math.max(4, 16 - 0.09 * a.craft);

  let p = base * directionMult * conditionMult + rng.gauss(0, sigma);
  let transcendent = false;
  if (rng.chance(a.instinct / 320)) {
    p += rng.float(9, 26);
    transcendent = true;
  }
  // §5.4 an incoherent film widens every outcome in it.
  const coh = film.coherence ?? 50;
  const varianceMult = 1 + 0.014 * (100 - coh);
  p = 63.6 + (p - 63.6) * Math.sqrt(varianceMult);

  return { value: clamp(p, 0, 100), transcendent, base };
}

// Resolve the four chosen positions into the two currencies.
function resolvePositions(positions, ctx) {
  const { genre, craft, directorCommand, partnerPositions } = ctx;
  const gw = GENRE_DIAL_WEIGHT[genre] || GENRE_DIAL_WEIGHT.drama;
  let forYou = 0, forFilm = 0, cost = 0, spikeCost = 0;

  for (const d of PERF_DIALS) {
    const pos = positions[d] || 'with';
    const [you, film] = READ[d][pos];
    forYou += you * (gw[d] ?? 1);
    forFilm += film;
    cost += POSITION_COST[pos];
    if (pos === 'beyond' || pos === 'against') spikeCost += POSITION_COST[pos];
  }

  const budget = contrastBudget(craft, directorCommand);
  const overspend = Math.max(0, cost - budget);
  const spikiness = clamp(spikeCost / 12, 0, 1);

  // §5.7 generosity and upstaging, resolved against the scene partner.
  let generosity = 0, upstaging = 0;
  if (partnerPositions) {
    for (const d of PERF_DIALS) {
      const mine = positions[d] || 'with';
      const theirs = partnerPositions[d] || 'with';
      const theirsBig = theirs === 'against' || theirs === 'beyond';
      if (mine === 'beneath' && theirsBig) generosity += 1;
      if (mine === 'beyond' && theirsBig) upstaging += 1;
    }
  }

  return {
    forYou: forYou - 5 * overspend - 1.5 * generosity + 2.0 * upstaging,
    forFilm: forFilm - 3 * overspend + 1.5 * generosity - 1.5 * upstaging,
    spikiness, overspend, budget, cost, generosity, upstaging,
  };
}

// The shape of a performance across three beats (§5.6), producing the single
// Notices value and the single Ensemble contribution used everywhere else.
function shapePerformance(perfValue, resolved, presence) {
  const lift = 9 * resolved.spikiness;
  const intro = perfValue - 0.65 * lift;
  const turn = perfValue + 1.30 * lift;
  const reso = perfValue - 0.65 * lift;
  const beats = { intro, turn, reso };
  const peak = Math.max(intro, turn, reso);

  const noticesRaw = 0.55 * peak + 0.45 * perfValue + resolved.forYou;
  // §4.1 Presence sets a floor. Re-scaled from the doc's 0.10×Presence, which
  // the review showed could never bind against a mean of 58.
  const floor = 0.42 * presence;

  return {
    beats,
    peak,
    notices: clamp(Math.max(noticesRaw, floor), 0, 100),
    ensembleValue: clamp(perfValue - 4.0 * resolved.spikiness + resolved.forFilm, 0, 100),
    floorBound: noticesRaw < floor,
  };
}

// ---------------------------------------------------------------------------
// Reception (§4.10) — one box office model, one Ensemble, one Notices.
// ---------------------------------------------------------------------------

// §10.6 budgets are quoted in the money of their year; the model works in
// start-year dollars. Everything that reasons about how big a film is goes
// through here, so the figure on the offer board and the figure inside the box
// office model are the same film.
function realBudget(role) {
  return role.budget / (role.era || 1);
}

// What a film has to take to wash its face: the budget plus prints and
// advertising, against the share of the gross that ever comes back.
function breakEven(budget) {
  return (budget * (1 + K.marketingShare)) / K.rightsShare;
}

function reception(rng, ctx) {
  const {
    film, genre, budget, scriptQuality, directorSkill, directorPrestige,
    castStarPower, genreDemand, ensembleScore, yourNotices, billing,
    stalenessPenalty = 0, palette,
  } = ctx;

  const pal = palette ? paletteEffect(palette, genre) : { aud: 0, crit: 0 };
  const productionValue = clamp(35 + 22 * Math.log10(Math.max(1, budget)), 0, 100);
  const postLuck = rng.gauss(52, 14);

  const projectQuality = clamp(
    0.31 * scriptQuality + 0.22 * directorSkill + 0.29 * ensembleScore
      + 0.08 * productionValue + 0.10 * postLuck,
    0, 100,
  );

  const filmCritic = clamp(
    projectQuality + GENRE_ECON[genre].critBias + 0.10 * (directorPrestige - 50)
      - stalenessPenalty + pal.crit + rng.gauss(0, 4.6),
    0, 100,
  );

  const bw = BILLING_WEIGHT[billing];
  const notices = clamp(
    0.52 * yourNotices + 0.25 * filmCritic + 0.13 * (50 + 30 * bw) + rng.gauss(0, 7),
    0, 100,
  );

  const audience = clamp(
    0.62 * projectQuality + 0.17 * genreDemand + 0.11 * castStarPower
      + 0.06 * (100 - projectQuality) + pal.aud + rng.gauss(0, 4.5),
    0, 100,
  );

  // FIX-4 the doc carried two incompatible box-office models (§4.10 and §8.2).
  // This is the §8.2 shape with §4.10's rights share, and it is the only one.
  const marketing = K.marketingShare * budget;
  const opening = budget * (K.openingBase + 0.005 * castStarPower + 0.005 * genreDemand)
    * Math.pow(budget / 30, -0.10);
  const z = audience + rng.gauss(0, 12);
  const legs = clamp(1.7 + 0.048 * (audience - 50) + 0.032 * Math.pow(Math.max(0, z - 70), 1.5), 1.15, 8.0);
  const gross = opening * legs;
  const roi = (K.rightsShare * gross) / (budget + marketing);

  return {
    projectQuality, filmCritic, notices, audience, postLuck,
    gross, roi, opening, legs, palette: pal,
    wrecked: postLuck < 30, blessed: postLuck > 74,
    film,
  };
}

// ---------------------------------------------------------------------------
// Standing update (§4.10 payoff, with FIX-1)
// ---------------------------------------------------------------------------

// FIX-1e Heat is market demand, and demand is a function of how many people
// saw you. A hit on a $4M film and a hit on a $140M film are the same ROI and
// nothing like the same career event — which is where the game's upper tail
// comes from, and why it is rare.
function reach(budget) {
  return clamp(K.reachBase + K.reachCoef * Math.log10(Math.max(1, budget)), 0.3, 1.7);
}

function applyReception(s, rec, billing, credits, budget = 20) {
  const bw = BILLING_WEIGHT[billing];
  const disc = discoveryMultiplier(credits);
  const rch = reach(budget);

  const dHeat = bw * disc * rch * (
    K.heatBase
    + K.heatRoiCoef * clamp(rec.roi - K.heatRoiCentre, -0.6, 2.2)
    + K.heatAudCoef * (rec.audience - K.heatAudCentre)
  );
  const dPrestige = bw * disc * (
    K.prestigeCriticCoef * (rec.filmCritic - K.prestigeCriticCentre)
    + K.prestigeNoticesCoef * (rec.notices - K.prestigeNoticesCentre)
  );
  const dAffection = bw * disc * rch * (K.affectionCoef * (rec.audience - K.affectionCentre));

  s.heat = clamp(s.heat + dHeat, 0, 100);
  s.prestige = clamp(s.prestige + dPrestige, 0, 100);
  s.affection = clamp(s.affection + dAffection, 0, 100);
  return { dHeat, dPrestige, dAffection, discovery: disc, reach: rch };
}

function decayStanding(s, billingThisYear) {
  s.heat *= heatKeep(billingThisYear);
  s.affection *= K.affectionKeep;
  s.prestige *= K.prestigeKeep;
  s.notoriety *= K.notorietyKeep;
}

function updateRecognition(actor, notices, billing) {
  // Deliberately not billing-weighted: five good minutes is five good minutes.
  const gain = K.recognitionGain * Math.max(0, notices - K.recognitionCentre)
    * (billing === 'lead' ? 0.6 : 1.0);
  actor.recognition = clamp(actor.recognition + gain, 0, 100);
}

// ---------------------------------------------------------------------------
// Awards (§4.11)
// ---------------------------------------------------------------------------

const NARRATIVES = {
  due: { bonus: 14, label: "She's due" },
  transformation: { bonus: 12, label: 'The transformation' },
  comeback: { bonus: 11, label: 'The comeback' },
  finalBow: { bonus: 10, label: 'The final bow' },
  newcomer: { bonus: 8, label: 'The newcomer' },
  posthumous: { bonus: 20, label: 'They were overdue and now they are gone' },
  tooCommercial: { bonus: -10, label: 'Too commercial' },
  overexposed: { bonus: -7, label: 'Overexposed' },
};

function narrativeBonus(flags) {
  let total = 0;
  const applied = [];
  for (const [k, on] of Object.entries(flags)) {
    if (on && NARRATIVES[k]) {
      total += NARRATIVES[k].bonus;
      applied.push(NARRATIVES[k].label);
    }
  }
  // FIX-7 the review found narrative outweighing merit ~2:1 against N(0,9).
  // Halved and capped, so a campaign fiction tilts a close race rather than
  // deciding an open one.
  return { total: clamp(total * 0.5, -12, 12), applied };
}

function buzzScore(rng, ctx) {
  const { notices, filmCritic, campaignSpend, prestige, flags, categoryAdvantage } = ctx;
  const nb = narrativeBonus(flags || {});
  const value = 0.34 * notices + 0.20 * filmCritic
    + 0.14 * clamp(28 * Math.log10(1 + campaignSpend), 0, 100)
    + 0.12 * prestige + nb.total + 0.10 * (categoryAdvantage || 0)
    + rng.gauss(0, 9);
  return { value, narratives: nb.applied };
}

function nominationChance(buzz) {
  return clamp(sig(0.13 * (buzz - K.buzzCentre)), 0, 0.62);
}

// ---------------------------------------------------------------------------
// Money (§11.6) — the going-broke ratchet
// ---------------------------------------------------------------------------

// Your fee is your quote or the going rate for the size of the film, whichever
// is larger — which is why a journeyman supporting actor makes a living and a
// star makes a fortune off the same curve.
function fee(rng, actor, role, agentTier, recentRoi, era = 1) {
  const q = quote(actor.standing, recentRoi, era);
  const bw = BILLING_WEIGHT[role.billing];
  const negotiate = 1 + rng.float(-1, 1) * agentTier.negotiate;
  const scaleRate = (K.scaleFeeBase + K.scaleFeeCoef * role.budget) * bw;
  const capped = Math.min(Math.max(q * bw, scaleRate) * negotiate, role.budgetForRole);

  return Math.max(0.005, capped) * (1 - agentTier.commission);
}

// §11.6 the going-broke ratchet. Money in is money in; what ruins people is
// that the way they live rises to meet their best year and then comes down far
// more slowly than the work does. The floor is charged once a year, in
// endYear() — never per payment, or a good year bills you several times over.
function applyLifestyle(moneyState, income) {
  moneyState.net += income;
  moneyState.lifetime += income;
  moneyState.floor = Math.max(moneyState.floor, K.lifestyleShare * income);
  return moneyState;
}


// namespace shim for what was `import * as M from './model.js'`
const M = { K, starPower, standing, bankability, quote, discoveryMultiplier, heatKeep, legibility, updatePersona, ageMismatchPenalty, fitScore, utility, offerProbability, castingPath, paletteEffect, coherence, landmarkChance, contrastBudget, performance, resolvePositions, shapePerformance, realBudget, breakEven, reception, reach, applyReception, decayStanding, updateRecognition, NARRATIVES, narrativeBonus, buzzScore, nominationChance, fee, applyLifestyle };


/* ===== engine/rolodex.js ===== */
// The Rolodex — §4.12 and §6.2.
//
// Forty-odd people exist and run their own careers. Eight are *tracked*, chosen
// dynamically: whoever you have worked with most, plus anyone currently holding
// a grudge or owing you something. The rest are real and quiet.
//
// Favours are tokens attached to named people, not a pool. You earn them by
// doing things that cost you and help them, you spend them on concrete
// outcomes, and they are gone when spent. They decay at one per five years of
// no contact — which is not upkeep, because there is no button that stops it
// and no reminder that nags you to press one. People drift. That is the fact
// being modelled.

const FAVOUR_EARNED = {
  scale: 2,            // took scale to be in their small film
  dayPlayer: 1,        // did a day on their project as a favour
  defended: 3,         // publicly defended them during a scandal
  recommended: 2,      // recommended them for a job they got
  picket: 2,           // held the line beside them
  hiredThem: 3,        // hired them when nobody else would
  generosity: 1,       // gave them the moment on set
};

const FAVOUR_SPENT = {
  directOffer: 2,      // a part, no audition
  attach: 3,           // they attach to your project
  hireWhoIName: 2,
  introduction: 1,
  publicBacking: 3,
};

class Rolodex {
  constructor(world) {
    this.world = world;
    this.edges = new Map();   // personId -> edge
  }

  edge(person) {
    let e = this.edges.get(person.id);
    if (!e) {
      e = {
        id: person.id,
        person,
        affinity: 0,
        grudge: 0,
        favours: 0,          // what they owe you
        owed: 0,             // what you owe them
        sharedProjects: 0,
        lastContact: null,
        history: [],
        dead: false,
      };
      this.edges.set(person.id, e);
    }
    e.person = person;
    return e;
  }

  note(person, text, year) {
    const e = this.edge(person);
    e.history.push({ year, text });
    if (e.history.length > 12) e.history.shift();
    e.lastContact = year;
    return e;
  }

  contact(person, year) {
    const e = this.edge(person);
    e.lastContact = year;
    e.sharedProjects += 1;
    return e;
  }

  gain(person, reason, year) {
    const e = this.edge(person);
    const n = FAVOUR_EARNED[reason] ?? 1;
    e.favours += n;
    e.affinity = clamp(e.affinity + 3 * n, -100, 100);
    e.lastContact = year;
    this.note(person, reasonText(reason, n), year);
    return n;
  }

  spend(person, reason, year) {
    const e = this.edge(person);
    const n = FAVOUR_SPENT[reason] ?? 1;
    if (e.favours < n) return false;
    e.favours -= n;
    e.lastContact = year;
    this.note(person, `You called it in. (−${n})`, year);
    return true;
  }

  // Eight tracked, chosen by weight rather than by the player maintaining a list.
  tracked(limit = 8) {
    const scored = [...this.edges.values()]
      .filter((e) => !e.dead)
      .map((e) => ({
        e,
        w: e.sharedProjects * 3 + e.favours * 4 + Math.abs(e.grudge) * 3
          + Math.abs(e.affinity) / 12 + (e.owed ? 5 : 0),
      }))
      .sort((a, b) => b.w - a.w);
    return scored.slice(0, limit).map((s) => s.e);
  }

  // Anyone who owes you enough to be worth calling.
  creditors(min = 2) {
    return [...this.edges.values()].filter((e) => !e.dead && e.favours >= min);
  }

  totalFavours() {
    return [...this.edges.values()].reduce((a, e) => a + (e.dead ? 0 : e.favours), 0);
  }

  // Called once a year. Favours fade with silence, and people die.
  tickYear(year, rng) {
    const gone = [];
    for (const e of this.edges.values()) {
      if (e.dead) continue;
      if (e.lastContact !== null && year - e.lastContact >= 5 && e.favours > 0) {
        e.favours -= 1;
        e.lastContact = year - 1; // reset the five-year clock
      }
      e.grudge = Math.max(0, e.grudge - 0.5);
      const age = e.person.age ?? 45;
      if (age > 62 && rng.chance(0.004 * (age - 62))) {
        e.dead = true;
        gone.push(e);
      }
    }
    return gone;
  }
}

function reasonText(reason, n) {
  const texts = {
    scale: 'You worked for nothing so they could make it.',
    dayPlayer: 'You gave them a day.',
    defended: 'You said so out loud, when nobody else would.',
    recommended: 'You put their name in a room they were not in.',
    picket: 'You stood on the line with them.',
    hiredThem: 'You hired them when nobody else would.',
    generosity: 'You gave them the scene.',
  };
  return `${texts[reason] || 'They owe you.'} (+${n})`;
}

// Ambitions — §0.4.
//
// An Ambition gates nothing. No content is locked behind it, no action is
// refused because of it. It decides what the obituary measures you against and
// gives the middle of a run a shape, and the interesting part is that they
// conflict in exactly the ways the systems already model: the Fortune wants
// tentpoles, the Prize wants a campaign block every year and a prestige lane,
// the Run wants you out of the ingenue lane by 35 and never chasing Heat.
//
// You may change it once. The game notes when you did, because people do.

const AMBITIONS = {
  work: {
    label: 'The Work',
    blurb: 'To be good. Whether anyone notices is not the measure.',
    measure: 'average notices across their credited roles,',
    score: (g) => mean(g.noticesHistory.length ? g.noticesHistory : [0]),
    grade: (v) => (v > 72 ? 'Achieved' : v > 62 ? 'Nearly' : v > 50 ? 'Sometimes' : 'No'),
    format: (v) => v.toFixed(1),
  },
  prize: {
    label: 'The Prize',
    blurb: 'The statue. Say it out loud; everyone else wants it too.',
    measure: 'awards won,',
    score: (g) => g.awards.wins * 10 + g.awards.nominations * 2,
    grade: (v) => (v >= 20 ? 'Achieved' : v >= 10 ? 'Nearly' : v > 0 ? 'Sometimes' : 'No'),
    format: (v) => `${v.toFixed(0)} pts`,
  },
  fortune: {
    label: 'The Fortune',
    blurb: 'Peak net worth, and what is left at the end.',
    measure: 'money kept,',
    score: (g) => Math.max(0, g.money.net) + 0.25 * g.money.lifetime,
    grade: (v) => (v > 90 ? 'Achieved' : v > 30 ? 'Nearly' : v > 6 ? 'Sometimes' : 'No'),
    format: (v) => `$${v.toFixed(0)}M`,
  },
  run: {
    label: 'The Run',
    blurb: 'To still be working at the top of the call sheet at seventy.',
    measure: 'years at the top of the call sheet,',
    score: (g) => g.stats.leadCredits + (g.stats.leadsAfter42 * 1.5),
    grade: (v) => (v >= 30 ? 'Achieved' : v >= 16 ? 'Nearly' : v >= 5 ? 'Sometimes' : 'No'),
    format: (v) => v.toFixed(0),
  },
  franchise: {
    label: 'The Franchise',
    blurb: 'To be the face of something bigger than any film in it.',
    measure: 'indispensability to a property,',
    score: (g) => g.stats.peakIdentification || 0,
    grade: (v) => (v >= 70 ? 'Achieved' : v >= 45 ? 'Nearly' : v > 12 ? 'Sometimes' : 'No'),
    format: (v) => v.toFixed(0),
  },
  voice: {
    label: 'The Voice',
    blurb: 'To be legible as one specific thing, and to be respected for it.',
    measure: 'legibility held with the critics on side,',
    score: (g) => g.stats.voiceYears * 2 + Math.max(0, g.actor.standing.prestige - 50),
    grade: (v) => (v >= 50 ? 'Achieved' : v >= 25 ? 'Nearly' : v > 6 ? 'Sometimes' : 'No'),
    format: (v) => v.toFixed(0),
  },
};

function ambitionReport(game) {
  const a = AMBITIONS[game.ambition] || AMBITIONS.work;
  const v = a.score(game);
  if (!game.credits.length) {
    return {
      label: a.label, measure: a.measure, value: '—',
      grade: 'Too early to say', changed: game.ambitionChangedAt,
    };
  }
  return {
    label: a.label,
    measure: a.measure,
    value: a.format(v),
    grade: a.grade(v),
    changed: game.ambitionChangedAt,
  };
}

// A soft nudge the interface can show: what this Ambition would have you do
// with the board in front of you. Advice, never a gate.
function ambitionAdvice(game, role) {
  switch (game.ambition) {
    case 'prize':
      return role.scriptQuality > 70 && role.billing !== 'bit'
        ? 'This is the kind of part that gets campaigned.' : null;
    case 'fortune':
      return role.budget > 90 ? 'This is where the money is.' : null;
    case 'run':
      return role.archetype === 'character_actor' || role.archetype === 'authority'
        ? 'This is the lane that stays open after fifty.' : null;
    case 'franchise':
      return role.type === 'tentpole' && role.billing === 'lead'
        ? 'Properties come from parts like this.' : null;
    case 'voice':
      return game.legibility < 70 && role.genre === dominantGenre(game)
        ? 'Another one of these sharpens what you are.' : null;
    case 'work':
    default:
      return role.director && game.world.directorSkill(role.director) > 72
        ? 'You would be better in this than in anything else on the board.' : null;
  }
}

function dominantGenre(game) {
  const g = game.actor.persona.genre;
  return Object.keys(g).reduce((best, k) => (g[k] > g[best] ? k : best), Object.keys(g)[0]);
}

function clampAmbition(key) {
  return AMBITIONS[key] ? key : 'work';
}

// At most one a year, and only when something in your state actually fired it.
function pickLifeEvent(game) {
  const eligible = LIFE_EVENTS.filter((e) => {
    if (game.firedEvents.has(e.id) && !e.repeatable) return false;
    try { return e.when(game); } catch { return false; }
  });
  if (!eligible.length) return null;
  return eligible[game.rng.int(0, eligible.length - 1)];
}

function eventPrompt(event, game) {
  return typeof event.prompt === 'function' ? event.prompt(game) : event.prompt;
}


/* ===== engine/arcs.js ===== */
// Arcs — the storylet patterns the one-shot events in events.js cannot express.
//
// The literature on quality-based narrative (Failbetter's storylets, and the
// pattern catalogue that grew out of them) names the shapes this file needs:
//
//   THE CHAIN   a sequence that progresses toward an ending
//   THE CLOCK   a hidden quality that rises on its own while conditions hold,
//               surfacing a different scene each time it crosses a threshold
//   THE GRAVITY WELL  what happens when a vein is exhausted, so a finished arc
//               leaves a mark rather than simply going quiet
//
// §11.2 asks for addiction "as an arc, not a flag", and that is exactly a
// clock driving a chain: the level rises because of how you are living, the
// scenes change as it rises, and the ending is different depending on where
// you got off.
//
// Same rules as everything else in this game: at most one of these reaches the
// player in a year, every option is defensible, and nothing here is upkeep —
// an arc's clock is driven by what you did, never by whether you clicked.

const ARCS_BY_ID = Object.fromEntries(ARCS.map((a) => [a.id, a]));

// Advance every running arc's clock and start any whose conditions now hold.
// Returns the arc scene to show, if one crossed a threshold this year.
function tickArcs(game) {
  let surfaced = null;
  for (const arc of ARCS) {
    const state = game.arcState(arc.id);
    if (state.done) continue;
    if (!state.started) {
      let starts = false;
      try { starts = arc.start(game); } catch { starts = false; }
      if (!starts) continue;
      state.started = game.year;
    }

    let drift = 0;
    try { drift = arc.drift(game); } catch { drift = 0; }
    state.level = clamp(state.level + drift, 0, 40);

    // The next stage this level has reached and not yet played.
    const next = arc.stages.find((s, i) => i >= state.stage && state.level >= s.at);
    if (!next || surfaced) continue;
    // Only surface if the scene can still be written — an arc about a person
    // who has left the story quietly closes instead.
    if (arc.who && !arc.who(game)) {
      state.stage = arc.stages.indexOf(next) + 1;
      if (state.stage >= arc.stages.length) state.done = true;
      continue;
    }
    surfaced = { arc, stage: next, index: arc.stages.indexOf(next) };
  }
  return surfaced;
}

function arcPrompt(arc, stage, game) {
  const who = arc.who ? arc.who(game) : null;
  if (typeof stage.prompt !== 'function') return stage.prompt;
  // The person an arc is about can be gone by the time its next scene fires —
  // the grudge faded, or they died. The arc has to survive that.
  if (arc.who && !who) return null;
  return stage.prompt(game, who);
}


/* ===== engine/world.js ===== */
// The world the career happens inside: genre demand cycles, a persistent
// Rolodex of directors and casting directors who age and have their own
// careers, and the project generator that fills the offer board.


// Instance-scoped so a replayed world hands out exactly the same ids.
const makeIds = () => { let n = 0; return () => `id${++n}`; };

class World {
  constructor(rng, startYear = 1974) {
    this.rng = rng;
    this.nextId = makeIds();
    this.usedTitles = new Set();
    this.year = startYear;
    this.startYear = startYear;
    this.quarter = 1;
    this.demand = {};
    this.momentum = {};
    this.greenlightQueue = {};
    for (const g of GENRES) {
      this.demand[g] = GENRE_ECON[g].demand;
      this.momentum[g] = 0;
      this.greenlightQueue[g] = [];
    }
    this.shapes = { ...SHAPES };
    this.scandals = [];
    this.landmarks = [];
    this.directors = [];
    this.castingDirectors = [];
    this.costars = [];
    this._populate();
  }

  _populate() {
    for (let i = 0; i < 12; i++) this.directors.push(this._makeDirector());
    for (let i = 0; i < 6; i++) this.castingDirectors.push(this._makeCastingDirector());
    for (let i = 0; i < 10; i++) this.costars.push(this._makeCostar());
  }

  name() {
    return `${this.rng.pick(FIRST_NAMES)} ${this.rng.pick(LAST_NAMES)}`;
  }

  // Two films in one career must never share a title, or the log reads as if
  // a picture was reviewed before it was cast.
  title() {
    for (let attempt = 0; attempt < 24; attempt++) {
      const t = this.rng.chance(0.12)
        ? this.rng.pick(TITLE_SOLO)
        : `${this.rng.pick(TITLE_A)} ${this.rng.pick(TITLE_B)}`;
      if (!this.usedTitles.has(t)) { this.usedTitles.add(t); return t; }
    }
    const t = `${this.rng.pick(TITLE_A)} ${this.rng.pick(TITLE_B)} ${this.rng.int(2, 4)}`;
    this.usedTitles.add(t);
    return t;
  }

  _makeDirector() {
    const rng = this.rng;
    return {
      id: this.nextId(),
      kind: 'director',
      name: this.name(),
      age: rng.int(28, 66),
      craft: clamp(rng.gauss(58, 15), 10, 98),
      vision: clamp(rng.gauss(55, 18), 5, 98),
      taste: clamp(rng.gauss(55, 16), 5, 98),
      command: clamp(rng.gauss(52, 16), 5, 98),
      prestige: clamp(rng.gauss(48, 20), 2, 98),
      temperament: rng.pick(['generous', 'exacting', 'chaotic', 'remote']),
      lane: rng.pick(GENRES),
      affinity: 0,
      grudge: 0,
      sharedProjects: 0,
      retired: false,
    };
  }

  _makeCastingDirector() {
    const rng = this.rng;
    return {
      id: this.nextId(),
      kind: 'casting',
      name: this.name(),
      // What this room rewards. You learn it by being in it.
      prefers: rng.pick(['bold', 'restrained', 'exact', 'warm']),
      memory: {},
      affinity: 0,
    };
  }

  _makeCostar() {
    const rng = this.rng;
    return {
      id: this.nextId(),
      kind: 'costar',
      name: this.name(),
      age: rng.int(22, 58),
      craft: clamp(rng.gauss(55, 16), 10, 96),
      instinct: clamp(rng.gauss(52, 18), 5, 96),
      presence: clamp(rng.gauss(55, 16), 5, 96),
      ego: clamp(rng.gauss(50, 22), 0, 100),
      heat: clamp(rng.gauss(30, 20), 0, 95),
      affinity: 0,
      grudge: 0,
      sharedProjects: 0,
    };
  }

  // §10.6 eras. Budgets and fees are held in start-year dollars throughout, so
  // a forty-year career's earnings mean one thing end to end; the era curve is
  // reserved for the technology shifts in §10.6 rather than for inflation.
  get eraMultiplier() {
    return 1;
  }

  // §7.3 the bridge from the director's attributes to the actor's model.
  directorSkill(d) {
    return clamp(0.45 * d.craft + 0.30 * d.vision + 0.25 * d.command, 0, 100);
  }

  // §7.7 how well the film comes together in post. The doc's version made the
  // average NPC director worse than the blind N(52,14) roll the reception model
  // was tuned against; re-centred so the population mean lands on 52.
  postSkill(d) {
    return clamp(52 + 0.30 * (d.craft - 58) + 0.25 * (d.taste - 55), 0, 100);
  }

  // §9.3 genre cycles. Greenlights lag demand by eight quarters, which is where
  // the overshoot comes from — the boom is always being fed by decisions made
  // two years ago.
  tickQuarter() {
    for (const g of GENRES) {
      const econ = GENRE_ECON[g];
      const queued = this.greenlightQueue[g];
      const arriving = queued.shift() || 0;
      const supplyPressure = arriving * 0.9;
      const pull = 0.06 * (econ.demand - this.demand[g]);
      this.momentum[g] = clamp(
        0.82 * this.momentum[g] + pull - supplyPressure + this.rng.gauss(0, 1.1) * econ.vol,
        -12, 12,
      );
      this.demand[g] = clamp(this.demand[g] + this.momentum[g], 8, 96);
      while (queued.length < 8) queued.push(0);
      // What the market greenlights now shows up in two years.
      queued[7] = clamp((this.demand[g] - econ.demand) / 18, -1.5, 2.5);
    }
    this.quarter += 1;
    if (this.quarter > 4) {
      this.quarter = 1;
      this.year += 1;
      this._ageWorld();
      this.tickLandmarks();
      this.tickScandals(this.rng);
    }
  }

  _ageWorld() {
    for (const d of this.directors) {
      d.age += 1;
      if (d.age > 70 && this.rng.chance(0.12)) d.retired = true;
      d.prestige = clamp(d.prestige - 0.6, 0, 100);
      if (d.retired && this.rng.chance(0.3)) {
        Object.assign(d, this._makeDirector(), { id: d.id });
      }
    }
    for (const c of this.costars) {
      c.age += 1;
      c.heat = clamp(c.heat * 0.92 + this.rng.gauss(3, 6), 0, 100);
    }
  }

  // A landmark permanently adds its palette to the world's coherence set, the
  // copies that follow feed the genre boom, and in about eight years the thing
  // you invented is a cliche you have to work against (§5.4). You get to watch
  // that happen to your own film.
  addShape(name, palette, genre, author) {
    const key = name.toLowerCase().replace(/[^a-z]+/g, '_');
    this.shapes[key] = { ...palette };
    this.momentum[genre] = (this.momentum[genre] || 0) + 2.5;
    const landmark = {
      key, name, genre, author, year: this.year, copies: 0, cliche: false,
    };
    this.landmarks.push(landmark);
    return landmark;
  }

  // Other directors copy what worked, then keep copying it.
  tickLandmarks() {
    for (const l of this.landmarks) {
      const age = this.year - l.year;
      if (age > 0 && age <= 10 && this.rng.chance(0.35)) {
        l.copies += 1;
        this.momentum[l.genre] += 0.35;
      }
      if (!l.cliche && (age >= 8 || l.copies >= 7)) {
        l.cliche = true;
        l.clicheYear = this.year;
      }
    }
  }

  // Is this palette now a tired copy of something? Critics can tell.
  clicheePenalty(palette) {
    let worst = 0;
    for (const l of this.landmarks) {
      if (!l.cliche) continue;
      const shape = this.shapes[l.key];
      if (!shape) continue;
      let sum = 0;
      for (const d of DIALS) sum += (palette[d] - shape[d]) ** 2;
      const dist = Math.sqrt(sum / DIALS.length);
      if (dist < 16) worst = Math.max(worst, 7 * (1 - dist / 16));
    }
    return worst;
  }

  // §9.4 the script market. Material exists whether or not anyone is making it.
  generateScript(rng, actor, opts = {}) {
    const genre = opts.genre || rng.pick(GENRES);
    const quality = clamp(rng.gauss(opts.quality ?? 60, 14), 20, 98);
    return {
      id: this.nextId(),
      title: this.title(),
      genre,
      quality,
      source: rng.pick(['original', 'novel', 'play', 'true story', 'short story']),
      charAge: clamp(Math.round(actor.age + rng.gauss(1, 5)), 14, 88),
      archetype: rng.pick(ARCHETYPES),
      askingBudget: clamp(GENRE_ECON[genre].budget * rng.float(0.4, 1.4), 1, 180),
      optioned: this.year,
      shopped: false,
      financingChance: 0,
      attachedDirector: null,
    };
  }

  // What the trades would print at the end of a year. No decisions in here —
  // it exists so the world is legible as something moving on its own, which is
  // most of what makes a simulation feel inhabited.
  tradePaper(game, seedRng) {
    // Its own stream: the trades are read whenever the player feels like it,
    // and anything the interface can call at will must not touch the sequence
    // the save file replays.
    const rng = new RNG((game.seed ^ (this.year * 2654435761)) >>> 0);
    void seedRng;
    const lines = [];
    const sorted = GENRES.slice().sort((a, b) => this.demand[b] - this.demand[a]);
    const hot = sorted[0];
    const cold = sorted[sorted.length - 1];
    const mom = this.momentum[hot];
    lines.push(mom > 1.5
      ? `Everyone is making ${hot} pictures. Demand ${this.demand[hot].toFixed(0)} and climbing, and the greenlights from two years ago are still arriving.`
      : mom < -1.5
        ? `The ${hot} boom is over. Four of them opened this year and three of them lost money.`
        : `${hot[0].toUpperCase()}${hot.slice(1)} is what sells this year. Nobody will finance ${cold}.`);

    const recent = this.landmarks.filter((l) => this.year - l.year <= 3);
    if (recent.length) {
      const l = recent[recent.length - 1];
      lines.push(l.author === game.actor.name
        ? `${l.name} has been copied ${l.copies} times since you made it.`
        : `Everyone is trying to shoot like ${l.name} now. ${l.copies} of them so far.`);
    }
    const tired = this.landmarks.filter((l) => l.cliche && this.year - (l.clicheYear || 0) <= 2);
    if (tired.length) {
      lines.push(`Critics have started using "${tired[0].name}-ish" as an insult.`);
    }

    for (const s of this.scandals) {
      lines.push(`${s.person.name} ${s.kind}${s.defendedBy ? `, and ${s.defendedBy} said so out loud` : ''}.`);
    }

    const retiring = this.directors.filter((d) => d.retired);
    if (retiring.length && rng.chance(0.5)) {
      lines.push(`${rng.pick(retiring).name} is not making another one.`);
    }

    const rising = this.costars.filter((c) => c.heat > 70).sort((a, b) => b.heat - a.heat)[0];
    if (rising) lines.push(`${rising.name} is suddenly in everything.`);

    return lines.slice(0, 5);
  }

  makeNewcomer(rng) {
    const c = this._makeCostar();
    c.age = rng.int(19, 25);
    c.heat = rng.float(0, 6);
    c.newcomer = true;
    this.costars.push(c);
    return c;
  }

  // Somebody is always in trouble. You can say something, or not.
  tickScandals(rng) {
    this.scandals = this.scandals.filter((s) => this.year - s.year < 2);
    if (this.scandals.length < 2 && rng.chance(0.16)) {
      const pool = [...this.directors.filter((d) => !d.retired), ...this.costars];
      const person = pool[rng.int(0, pool.length - 1)];
      this.scandals.push({
        person,
        year: this.year,
        kind: rng.pick([
          'is being sued by a former assistant',
          'said something unforgivable in a magazine',
          'walked off a picture and will not say why',
          'is being written about by four reporters at once',
        ]),
      });
    }
  }

  randomPalette(rng, genre, budget, directorTaste) {
    // Directors gravitate toward a shape and then push it. Money constrains
    // scale: a $5M film cannot be epic.
    const shape = rng.pick(Object.values(this.shapes));
    const spread = clamp(34 - 0.22 * directorTaste, 8, 34);
    const p = {};
    for (const d of DIALS) p[d] = clamp(shape[d] + rng.gauss(0, spread), -50, 50);
    p.scale = clamp(Math.min(p.scale, -40 + 26 * Math.log10(Math.max(1, budget))), -50, 50);
    return p;
  }

  generateRole(actor, opts = {}) {
    const rng = this.rng;
    // What the board offers you tracks who the industry thinks you are. Nobody
    // sends a star a bit part, and nobody sends an unknown a lead.
    const s = clamp(actor.standingScalar ?? 0, 0, 100) / 100;
    // §4.9 the cliff. Lead offers thin out from the early forties, and only
    // standing buys you past it — which is what makes the pivot to character
    // and authority roles a real strategic problem rather than a mood.
    const ageLead = clamp(1 - Math.max(0, (actor.age - 40)) * 0.14, 0.04, 1) + 0.18 * s;
    const billing = opts.billing || rng.weighted([
      ['lead', (0.04 + 1.30 * Math.pow(s, 1.8)) * ageLead],
      ['supporting', 0.34 + 0.30 * s],
      ['bit', Math.max(0.05, 0.60 - 0.55 * s)],
    ]);
    // Scale tracks standing too. Nobody hands a $180M film to a stranger, and
    // the tentpole board is where the game's money actually is.
    const type = rng.weighted([
      ['indie', Math.max(0.06, 0.28 - 0.18 * s)],
      ['studio', 0.30],
      ['tentpole', 0.02 + 0.40 * Math.pow(s, 1.5)],
      ['streaming', 0.14], ['tv_season', 0.08],
      ['theatre', 0.06], ['voice', 0.06],
    ]);
    // §4.2 the typecasting engine, on the offer side. The more legible you are,
    // the more the board is just your lane again — which is the flood of work
    // and the cage, in one number. An illegible actor gets a varied board and
    // fewer offers on it.
    const leg = clamp(actor.legibilityValue ?? 0, 0, 100);
    const inLane = rng.chance(0.18 + 0.006 * leg);
    const genre = inLane
      ? rng.weighted(GENRES.map((g) => [g, 0.4 + (actor.persona?.genre?.[g] ?? 10) / 12]))
      : rng.weighted(GENRES.map((g) => [g, 0.5 + this.demand[g] / 40]));
    const econ = GENRE_ECON[genre];
    // Budgets are nominal, so they inflate with the era exactly as fees do.
    const era = this.eraMultiplier;
    const budget = clamp(
      econ.budget * PROJECT_TYPES[type].budgetMult * rng.float(0.5, 1.7), 0.4, 400,
    ) * era;
    const gatekeeper = type === 'tentpole' ? 'tentpole'
      : type === 'indie' ? (rng.chance(0.45) ? 'auteur' : 'indie')
      : type === 'streaming' ? 'streamer'
      : type === 'tv_season' ? 'network'
      : rng.chance(0.2) ? 'franchise' : 'tentpole';

    const director = rng.pick(this.directors.filter((d) => !d.retired)) || this.directors[0];
    const charAge = clamp(
      Math.round(actor.age + rng.gauss(billing === 'bit' ? 0 : 2, 7)), 8, 88,
    );
    const archetype = inLane
      ? rng.weighted(ARCHETYPES.map((x) => [x, 0.4 + (actor.persona?.archetype?.[x] ?? 10) / 12]))
      : rng.pick(ARCHETYPES);
    const share = billing === 'lead' ? 0.14 : billing === 'supporting' ? 0.06 : 0.015;

    return {
      id: this.nextId(),
      title: this.title(),
      genre, type, billing, gatekeeper, archetype, charAge,
      blocks: PROJECT_TYPES[type].blocks,
      label: PROJECT_TYPES[type].label,
      budget,
      budgetForRole: Math.max(0.05, budget * share),
      difficulty: BILLING_DIFFICULTY[billing]
        + (type === 'tentpole' ? 6 : type === 'indie' ? -6 : 0),
      typeStrictness: clamp(rng.gauss(0.55, 0.22), 0.1, 1.0),
      scriptQuality: clamp(rng.gauss(58, 17), 5, 98),
      chaos: clamp(rng.gauss(45, 20), 0, 100),
      director,
      castingDirector: rng.pick(this.castingDirectors),
      costar: rng.pick(this.costars),
      gates: this._gatesFor(genre, archetype, rng),
      union: type !== 'indie' || rng.chance(0.5),
      demand: this.demand[genre],
      era,
    };
  }

  _gatesFor(genre, archetype, rng) {
    const g = {};
    if (genre === 'action' || genre === 'period') g.physicality = rng.int(45, 80);
    if (genre === 'musical' || genre === 'period') g.voice = rng.int(45, 80);
    if (archetype === 'romantic_lead' || archetype === 'ingenue') g.look = rng.int(50, 82);
    return g;
  }
}

function makeWorld(seed, startYear) {
  return new World(new RNG(seed ^ 0x5f3a), startYear);
}

// Part 6 — leverage: the half of a career where you act on the industry.
//
// Everything in this file is PULL. The game never prompts any of it, never
// reminds you it exists, and never punishes you for not opening the menu
// (§0.3 rule 2b). That is the licence for the breadth: a player who ignores
// this file plays a clean uncluttered career, and sim/agency.mjs verifies that
// such a career still meets every target in §14.9.
//
// The gates are resources — favours, standing, money, blocks, information —
// never permissions (§6.7). There is no ladder and no prerequisite anywhere in
// this catalogue.

// The interface asks for this and shows the top few. Nothing is hidden — the
// ranking exists so that a fifty-year-old with thirty available verbs sees the
// same size list as a twenty-four-year-old with six (§0.3 rule 3).
function availableActions(game, ctx = {}) {
  return ACTIONS
    .filter((a) => {
      try { return a.available(game, ctx); } catch { return false; }
    })
    .map((a) => ({ action: a, salience: a.salience(game, ctx) }))
    .sort((x, y) => y.salience - x.salience);
}

function perform(game, actionId, ctx = {}) {
  const a = ACTIONS_BY_ID[actionId];
  if (!a) return { text: 'No such move.' };
  if (!a.available(game, ctx)) return { text: 'Not available to you right now.' };
  const result = a.run(game, ctx, game.rng);
  game.say(result.text, 'lever');
  game.leverageUsed += 1;
  return result;
}

    this.world = new World(new RNG(seed ^ 0x5f3a), opts.startYear ?? 1974);
    this.log = [];
    this.actor = this._makeActor(opts.background ?? 'conservatory', opts.name);
    this.board = [];
    this.pending = [];        // projects shot but not yet released
    this.credits = [];
    this.awards = { nominations: 0, wins: 0, thisSeason: [] };
    this.money = { net: this.actor.money, floor: 0.02, lifetime: 0 };
    this.blocksBooked = 0;    // blocks used in the current year
    this.yearBilling = null;  // best billing worked this year, drives decay
    this.idleYears = 0;
    this.offerlessYears = 0;   // years in which nothing at all was offered
    this.yearListings = 0;
    this.over = false;
    this.obituaryText = null;
    this.stats = {
      peakHeat: 0, leadCredits: 0, leadsAfter42: 0, yearsActive: 0,
      peakIdentification: 0, voiceYears: 0, coldYears: 0,
    };

    // §0.4 what the obituary will measure you against. Gates nothing.
    this.ambition = clampAmbition(opts.ambition ?? 'work');
    this.ambitionChangedAt = null;

    // Part 6 — the leverage layer. All of it pull, none of it pushed.
    this.rolodex = new Rolodex(this.world);
    this.development = [];        // material you optioned or funded
    this.franchise = null;        // the property you are identified with
    this.approvals = new Set();   // script / costar / director / cut
    this.positions = new Set();   // guild / juror / prodco / teacher / board
    this.mentees = [];
    this.information = [];        // things you know about specific people
    this.scarcity = 0;
    this.hiatus = false;
    this.hiatusUntil = null;   // set when the break is a fixed length
    this.criticSkew = 0;
    this.courtedCritics = 0;
    this.campaignSpend = 0;
    this.categoryFraud = false;
    this.campaignedThisYear = false;
    this.campaignStreak = 0;
    this.leverageUsed = 0;
    this.noticesHistory = [];
    this.turnedDown = [];         // §0.6 — the obituary remembers these
    this.currentRole = null;      // cast, not yet shot: what project verbs act on

    // The anti-tedium instrumentation. Every time the game stops and asks the
    // player something, it counts here; sim/agency.mjs holds the line.
    this.pushes = 0;
    this.pushesByYear = new Map();

    // Every mutating call, in order. The engine is deterministic from its
    // seed, so this list IS the save file: replaying it rebuilds the exact
    // career, and it doubles as a record of what the player actually did.
    this.journal = [];
    this.replaying = false;

    // At most one life event a year, each fired by something true about your
    // state rather than by a die roll (§0.1, and rule 1: never upkeep).
    this.firedEvents = new Set();
    this.pendingEvent = null;
    // Long shapes: a hidden level that rises from how you are living, and a
    // sequence of scenes that plays as it crosses thresholds (arcs.js).
    this.arcs = {};

    // Standing orders — how you work when the game does not need to ask.
    this.standingOrders = {
      prep: 'table',              // default approach
      stance: 'shaped',           // shaped | generous | showy | still
      floor: 'anything',          // anything | supporting | lead
      askWhenInteresting: true,   // false = never ask, run on defaults
    };
  }

  // Everything the interface does to the game goes through here.
  call(name, args = []) {
    if (!this.replaying) this.journal.push([name, args]);
    switch (name) {
      case 'openBoard': return this.openBoard();
      case 'filmFor': return this.filmFor(this.findRole(args[0]));
      case 'pursue': return this.pursue(args[0]);
      case 'decline': return this.decline(args[0]);
      case 'shoot': return this.shoot(this.currentRole, args[0]);
      case 'do': return this.do(args[0], this.resolveCtx(args[1]));
      case 'tickPending': return this.tickPending();
      case 'tickQuarter': return this.world.tickQuarter();
      case 'endYear': return this.endYear();
      case 'orders': Object.assign(this.standingOrders, args[0]); return this.standingOrders;
      case 'ambition': return this.setAmbition(args[0]);
      case 'event': return this.resolveEvent(args[0]);
      default: throw new Error(`unknown call ${name}`);
    }
  }

  findRole(id) {
    return this.board.find((r) => r.id === id) || this.currentRole;
  }

  // Contexts hold live objects; the journal holds ids, and this puts them back.
  resolveCtx(ref = {}) {
    const ctx = {};
    if (ref.role) ctx.role = this.findRole(ref.role);
    if (ref.person) ctx.person = [...this.rolodex.edges.values()].find((e) => e.id === ref.person);
    if (ref.script) ctx.script = this.development.find((sc) => sc.id === ref.script);
    if (ref.project) ctx.project = this.pending.find((p) => p.role.id === ref.project);
    if (ref.scandal) ctx.scandal = this.world.scandals.find((sc) => sc.person.id === ref.scandal);
    return ctx;
  }

  static ctxRef(ctx = {}) {
    const ref = {};
    if (ctx.role) ref.role = ctx.role.id;
    if (ctx.person) ref.person = ctx.person.id;
    if (ctx.script) ref.script = ctx.script.id;
    if (ctx.project) ref.project = ctx.project.role.id;
    if (ctx.scandal) ref.scandal = ctx.scandal.person.id;
    return ref;
  }

  // The film's palette is rolled once, lazily, and remembered — it consumes
  // randomness, so it has to happen at a fixed point in the sequence.
  filmFor(role) {
    if (!role) return null;
    if (!role.palette) {
      role.palette = this.world.randomPalette(this.rng, role.genre, role.budget, role.director.taste);
    }
    return { palette: role.palette, ...M.coherence(role.palette) };
  }

  // A cheap value that must match after a replay if the replay is faithful.
  fingerprint() {
    const a = this.actor;
    return [
      this.year, a.age, a.name, this.credits.length, this.turnedDown.length,
      a.standing.heat.toFixed(4), a.standing.prestige.toFixed(4),
      a.standing.affection.toFixed(4), a.standing.notoriety.toFixed(4),
      a.attrs.craft.toFixed(4), this.money.net.toFixed(4), this.money.lifetime.toFixed(4),
      this.awards.nominations, this.awards.wins, this.favours, this.scarcity,
      this.leverageUsed, this.board.map((r) => r.id).join('/'),
    ].join('|');
  }

  save() {
    return {
      version: 1,
      seed: this.seed,
      background: this.actor.background,
      ambition: this.ambition,
      // The *given* name, not the current one: an unnamed actor draws their
      // name from the world's pool, which consumes randomness, and a replay
      // has to consume it in the same place. A mid-career name change is in
      // the journal already.
      name: this.actor.givenName,
      startYear: this.world.startYear,
      journal: this.journal,
    };
  }

  static load(data) {
    const g = new Game({
      seed: data.seed,
      background: data.background,
      ambition: data.ambition,
      name: data.name,
      startYear: data.startYear,
    });
    g.replaying = true;
    for (const [name, args] of data.journal) g.call(name, args);
    g.replaying = false;
    g.journal = data.journal.slice();
    return g;
  }

  // ------------------------------------------------------------------ pushes
  countPush(kind, n = 1) {
    this.pushes += n;
    const y = this.pushesByYear.get(this.year) || { total: 0 };
    y.total += n;
    y[kind] = (y[kind] || 0) + n;
    this.pushesByYear.set(this.year, y);
  }

  _makeActor(backgroundKey, name) {
    const bg = BACKGROUNDS[backgroundKey] || BACKGROUNDS.conservatory;
    const rng = this.rng;
    const jitter = (v, sd = 7) => clamp(rng.gauss(v, sd), 5, 95);
    const genre = {}; for (const g of GENRES) genre[g] = clamp(rng.gauss(12, 6), 0, 100);
    const archetype = {}; for (const a of ARCHETYPES) archetype[a] = clamp(rng.gauss(12, 6), 0, 100);

    return {
      name: name || this.world.name(),
      givenName: name || null,
      background: backgroundKey,
      age: bg.age,
      attrs: {
        craft: jitter(bg.attrs.craft),
        instinct: jitter(bg.attrs.instinct, 12),
        presence: jitter(bg.attrs.presence),
        resilience: jitter(bg.attrs.resilience),
      },
      gates: {
        look: clamp(rng.gauss(bg.label === 'Discovered' ? 68 : 52, 16), 5, 98),
        voice: clamp(rng.gauss(52, 15), 5, 98),
        physicality: clamp(rng.gauss(52, 15), 5, 98),
      },
      standing: { heat: 2, prestige: 3, affection: 2, notoriety: 0 },
      persona: { genre, archetype },
      recognition: bg.recognition,
      unionCredits: bg.unionCredits,
      agent: bg.agent,
      health: 92,
      condition: 88,
      money: bg.money,
      favours: 0,
      quote: 0.05,
      recentRoi: 1,
      consecutiveSameLane: 0,
      lastLane: null,
      flags: {},
      genreCredits: {},
      solvedGates: {},
      lastWorkedYear: null,
    };
  }

  // ------------------------------------------------------------------ getters
  get year() { return this.world.year; }
  get quarter() { return this.world.quarter; }
  get standing() { return M.standing(this.actor.standing); }
  get legibility() { return M.legibility(this.actor.persona); }
  get agentTier() { return AGENT_TIERS[this.actor.agent]; }
  get favours() { return this.rolodex.totalFavours(); }

  // The pull surface. Nothing here is ever prompted (§0.3 rule 2b).
  moves(ctx = {}) {
    return availableActions(this, { role: ctx.role, current: this.currentRole, ...ctx });
  }

  do(actionId, ctx = {}) {
    return perform(this, actionId, { role: ctx.role, current: this.currentRole, ...ctx });
  }

  ambitionReport() { return ambitionReport(this); }

  setAmbition(key) {
    if (this.ambitionChangedAt !== null) return false;
    const next = clampAmbition(key);
    if (next === this.ambition) return false;
    this.ambition = next;
    this.ambitionChangedAt = this.year;
    this.say(`You want something else now.`, 'note');
    return true;
  }

  flagCampaign(role) { role.publicCampaign = true; }

  // The season only stops the game when there is something to decide: a
  // performance worth campaigning and the means to campaign it. Otherwise it
  // resolves on its own and you read about it (§4.11, §0.1).
  seasonNeedsYou() {
    if (!this.awards.thisSeason.length) return false;
    const contender = this.awards.thisSeason.some((e) => e.rec.notices > 62);
    const canAfford = this.money.net > 0.4 && this.blocksBooked < 4;
    return contender && canAfford;
  }

  markWorked(billing) {
    this.actor.lastWorkedYear = this.year;
    if (!this.yearBilling || BILLING_WEIGHT[billing] > BILLING_WEIGHT[this.yearBilling]) {
      this.yearBilling = billing;
    }
  }

  // §0.3 rule 3 — options narrow. The three moments are three the first
  // dozen times; after forty pictures a set holds one surprise, not three,
  // and the ones that still fire are the ones that swing hardest. A chaotic
  // production or a director you have never met puts them back.
  // What your standing orders do on set when the game does not stop to ask.
  // The scene still happens either way — you are simply not consulted about
  // the ones you have handled a hundred times.
  defaultMomentChoice(momentId, moment) {
    const stance = this.standingOrders.stance;
    const table = {
      generous: { not_working: 'absorb', adjustment: 'take', discovery: 'offer' },
      showy:    { not_working: 'suggest', adjustment: 'argue', discovery: 'keep' },
      still:    { not_working: 'ask', adjustment: 'take', discovery: 'lose' },
      shaped:   { not_working: 'ask', adjustment: 'both', discovery: 'offer' },
    };
    const named = (table[stance] || table.shaped)[momentId];
    if (named) return named;
    // For the situational moments, standing orders mean: the professional
    // answer, which is the middle one.
    const opts = (moment || MOMENT_POOL.find((m) => m.id === momentId))?.options || [];
    const idx = stance === 'showy' ? 0 : stance === 'generous' ? Math.min(1, opts.length - 1)
      : Math.floor(opts.length / 2);
    return opts[clamp(idx, 0, opts.length - 1)]?.id;
  }

  momentsFor(role) {
    const n = this.credits.length;
    let count = n < 12 ? 3 : n < 26 ? 2 : n < 40 ? 1 : 0;
    if (role.chaos > 80) count += 1;                                  // a bad set is a bad set
    if ((role.director.sharedProjects || 0) === 0 && n < 30) count += 1;   // a stranger directing
    if (role.billing === 'bit') count = Math.min(count, 1);           // you are here for a day
    count = clamp(count, 0, 3);
    if (!count) return [];

    // Which moments this particular production can even produce. The ones
    // specific to this set come first: they are the reason the shoot is not
    // the same nine table cells every time.
    const pool = momentsAvailable({
      role, costar: role.costar, director: role.director, chaos: role.chaos,
    });
    const specific = pool.filter((m) => !m.core);
    const core = pool.filter((m) => m.core);
    const picked = [];
    const rng = this.rng;
    while (picked.length < count && (specific.length || core.length)) {
      const from = specific.length && (picked.length === 0 || rng.chance(0.5)) ? specific : core;
      if (!from.length) break;
      picked.push(from.splice(rng.int(0, from.length - 1), 1)[0]);
    }
    return picked;
  }

  // §4.6 / §5.5 — the game only asks about prep and stance when the answer
  // could reasonably differ. Everything else runs on your standing orders, and
  // that is the whole reason breadth does not become tedium.
  shouldAskPrep(role) {
    if (!this.standingOrders.askWhenInteresting) return false;
    // A gate you cannot clear is worth a conversation the first couple of
    // times. After that you have a dialect coach on speed dial and the answer
    // is not in question — which is why an ageing actor does not get asked
    // about their voice every single picture.
    for (const [gate, req] of Object.entries(role.gates || {})) {
      if ((this.actor.gates[gate] ?? 50) < req && (this.actor.solvedGates[gate] || 0) < 2) return true;
    }
    // Research pays on these, so the answer might differ — but only until you
    // have done enough of them to have a way of working.
    if ((role.genre === 'period' || role.archetype === 'authority')
        && this.actor.persona.genre.period < 55) return true;
    return role.billing === 'lead' && this.credits.length < 12;
  }

  shouldAskStance(role, film) {
    if (!this.standingOrders.askWhenInteresting) return false;
    if ((film.coherence ?? 50) < 42) return true;         // wide open, no shape to read
    // Your first horror picture is a question. Your fourth is not, and by
    // twenty-five credits you have a way of working in anything.
    if (!(this.actor.genreCredits[role.genre] > 0) && this.credits.length < 25) return true;
    // Your first leads are decisions. Your twentieth is a Tuesday, and your
    // standing orders cover it unless the film itself is strange.
    return role.billing === 'lead' && this.stats.leadCredits < 8;
  }

  // The stance your standing orders reach for, spent against your budget.
  autoPositions(role) {
    const budget = M.contrastBudget(this.actor.attrs.craft, role.director.command);
    const pos = { energy: 'with', volume: 'with', warmth: 'with', speed: 'with' };
    const pay = role.genre === 'comedy' ? 'speed'
      : role.genre === 'romance' || role.genre === 'family' ? 'warmth' : 'energy';
    switch (this.standingOrders.stance) {
      case 'generous':
        pos.volume = 'beneath'; if (budget >= 3) pos[pay] = 'beneath';
        break;
      case 'showy':
        if (budget >= 3) pos[pay] = 'against';
        if (budget >= 5) pos.volume = 'beyond';
        break;
      case 'still':
        pos.energy = 'against'; if (budget >= 4.3) pos.volume = 'beneath';
        break;
      case 'shaped':
      default:
        if (budget >= 3) pos[pay] = 'against';
        if (budget >= 4.3) pos[pay === 'energy' ? 'volume' : 'energy'] = 'beneath';
    }
    return pos;
  }

  say(text, kind = 'note') {
    this.log.push({ year: this.year, quarter: this.quarter, kind, text });
    if (this.log.length > 400) this.log.shift();
    return text;
  }

  // ------------------------------------------------------------- offer board
  openBoard() {
    const a = this.actor;
    if (this.hiatus) {
      // +6 a quarter, capped at 40 — two years away is the full effect (§6.6).
      this.scarcity = clamp(this.scarcity + 6, 0, 40);
      // And the industry's picture of you softens while you are gone. This is
      // the real prize of vanishing: you come back readable as something else.
      for (const vec of [a.persona.genre, a.persona.archetype]) {
        const keys = Object.keys(vec);
        const avg = keys.reduce((t, k) => t + vec[k], 0) / keys.length;
        for (const k of keys) vec[k] += (avg - vec[k]) * 0.10;
      }
      this.board = [];
      return this.board;
    }
    a.quote = M.quote(a.standing, a.recentRoi, this.world.eraMultiplier);
    const sp = M.starPower(a.standing);
    // §6.6 — scarcity raises the *tier* of what you are offered, not just the
    // script quality. Being unavailable is a way of being wanted, and without
    // this term disappearing is strictly worse, which would make it a trap
    // rather than a strategy.
    a.standingScalar = M.standing(a.standing) + M.K.recognitionTier * a.recognition
      + 0.60 * this.scarcity;
    a.legibilityValue = this.legibility;
    const band = this._ageBand(a.age);
    // Some quarters the phone does not ring. That has to be possible or the
    // career has no downside and every run converges on the same shape.
    // Offers are lumpy. A rate of 1.2 a quarter is one offer most quarters and
    // two sometimes — and a rate of 0.4 is three quarters of nothing, which is
    // what the back half of most careers actually looks like.
    const rate = (0.4 + sp / 10 + a.recognition / 30 + this.agentTier.offers) * band;
    const count = clamp(
      Math.floor(rate) + (this.rng.chance(rate % 1) ? 1 : 0),
      0, 9,
    );

    // §6.6 disappearing. Two years away costs about eighteen Heat and buys
