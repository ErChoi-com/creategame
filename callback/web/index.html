<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALLBACK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hud" hidden>
    <div class="hud-left">
      <span id="hud-name"></span>
      <span class="dim" id="hud-when"></span>
    </div>
    <div class="meters">
      <div class="meter" title="Current market demand. Falls on its own; only work raises it.">
        <label>Heat</label><div class="bar"><i id="m-heat"></i></div><span id="v-heat"></span>
      </div>
      <div class="meter" title="Industry respect. Very sticky.">
        <label>Prestige</label><div class="bar"><i id="m-prestige"></i></div><span id="v-prestige"></span>
      </div>
      <div class="meter" title="Public warmth. Drives turnout.">
        <label>Affection</label><div class="bar"><i id="m-affection"></i></div><span id="v-affection"></span>
      </div>
      <div class="meter" title="Scandal heat. Sometimes an asset.">
        <label>Notoriety</label><div class="bar"><i id="m-notoriety"></i></div><span id="v-notoriety"></span>
      </div>
    </div>
    <div class="hud-right">
      <span id="hud-quote"></span>
      <span id="hud-money"></span>
    </div>
  </header>

  <main id="stage"></main>

  <aside id="ledger" hidden>
    <h3>The year so far</h3>
    <ol id="log"></ol>
  </aside>
</body>
<script type="module" src="app.js"></script>
</html>
